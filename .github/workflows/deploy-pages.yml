name: Deploy BMIPROGRAM to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PRODUCTION_URL: https://programvalaszto.magyariskola.at

concurrency:
  group: bmi-production
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --check data.js
          node --check app.js
          node --check catalog.js
          node --check scripts/validate.mjs
          node --check scripts/validate-schema-age.mjs
          node --check scripts/validate-matching.mjs
          node --check scripts/validate-copy.mjs

      - name: Recommendation and registry validation
        run: |
          set -euo pipefail
          node scripts/validate.mjs
          node scripts/validate-schema-age.mjs
          node scripts/validate-matching.mjs
          node scripts/validate-copy.mjs

      - name: Release-critical recommendation contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "if(!ageEligible(p))return-1" app.js
          grep -Fq "if(interestEligible(p))score+=60" app.js
          grep -Fq "var relevant=eligible.filter(interestEligible)" app.js
          grep -Fq "Mind a 26 foglalkozás és képzés" app.js
          grep -Fq "Nincs megfelelő BMI-találat" app.js
          grep -Fq "https://ungarischlernen.at" app.js
          grep -Fq "https://amaped.at" app.js

          grep -Fq 'id:"schweden-1"' data.js
          grep -Fq 'minAge:6,maxAge:10' data.js
          grep -Fq 'when:"Minden szombaton 10:00–12:00"' data.js
          grep -Fq 'id:"schweden-2"' data.js
          grep -Fq 'minAge:10,maxAge:14' data.js
          grep -Fq 'when:"Kéthetente szombatonként 12:00–14:00"' data.js
          grep -Fq 'id:"rajztabla"' data.js
          grep -Fq 'minAge:10,maxAge:16' data.js
          grep -Fq 'id:"gimi-svung"' data.js
          grep -Fq 'minAge:14,maxAge:18' data.js
          grep -Fq 'id:"fecskeklub"' data.js
          grep -Fq 'minAge:8,maxAge:14' data.js
          grep -Fq 'id:"napraforgocskak"' data.js
          grep -Fq 'minAge:6,maxAge:15' data.js
          grep -Fq 'id:"rekreacio"' data.js
          grep -Fq 'relationship:"bmi-partner"' data.js
          grep -Fq 'id:"jollet"' data.js

          grep -Fq 'BMIPROGRAM — neutral structural foundation' styles.css
          grep -Fq 'BMIPROGRAM — human editorial monochrome design system' ui-20260821.css
          grep -Fq '<meta name="theme-color" content="#ffffff">' index.html
          grep -Fq '<b>26</b><span>foglalkozás és képzés</span>' index.html
          grep -Fq '<b>7</b><span>nap a héten</span>' index.html
          echo 'PASS: 26-program hard-age BMI-first contracts are intact.'

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'scripts/' \
            --exclude '_site/' \
            --exclude 'release.txt' \
            --exclude 'version.json'

          short_sha="${GITHUB_SHA::12}"
          release_date="$(date -u +'%Y-%m-%d')"
          built_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          release_id="${release_date}-${short_sha}"

          for html in _site/*.html; do
            sed -E -i "s#styles\.css\?v=[^\"']+#styles.css?v=${short_sha}#g" "$html"
            sed -E -i "s#ui-20260821\.css\?v=[^\"']+#ui-20260821.css?v=${short_sha}#g" "$html"
            sed -E -i "s#recommendation-polish\.css\?v=[^\"']+#recommendation-polish.css?v=${short_sha}#g" "$html"
            sed -E -i "s#data\.js\?v=[^\"']+#data.js?v=${short_sha}#g" "$html"
            sed -E -i "s#app\.js\?v=[^\"']+#app.js?v=${short_sha}#g" "$html"
            sed -E -i "s#catalog\.js\?v=[^\"']+#catalog.js?v=${short_sha}#g" "$html"
          done

          cat > _site/release.txt <<EOF
          BMIPROGRAM_RELEASE=${release_id}
          GIT_SHA=${GITHUB_SHA}
          SCHOOL_YEAR=2026/2027
          PROGRAM_COUNT=26
          SOURCE_POLICY=canonical-current-2026-27-only
          RECOMMENDER=age-hard-interest-first-bmi-fallback
          BUILT_AT=${built_at}
          EOF

          cat > _site/version.json <<EOF
          {"release":"${release_id}","gitSha":"${GITHUB_SHA}","schoolYear":"2026/2027","programCount":26,"sourcePolicy":"canonical-current-2026-27-only","recommender":"age-hard-interest-first-bmi-fallback","builtAt":"${built_at}"}
          EOF

          test -f _site/index.html
          test -f _site/data.js
          test -f _site/app.js
          test -f _site/catalog.js
          test "$(cat _site/CNAME)" = "programvalaszto.magyariskola.at"
          grep -Fq 'PROGRAM_COUNT=26' _site/release.txt
          grep -Fq 'id:"rekreacio"' _site/data.js
          grep -Fq 'Minden szombaton 10:00–12:00' _site/data.js
          grep -Fq 'Kéthetente szombatonként 12:00–14:00' _site/data.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy exact artifact
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact production release
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="${GITHUB_SHA}"
          base="${PRODUCTION_URL%/}"
          fetch() {
            local path="$1"
            curl --fail --silent --show-error --location --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "${base}${path}?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          }

          release=''
          for attempt in $(seq 1 30); do
            if release="$(fetch /release.txt 2>/dev/null)" && grep -Fq "GIT_SHA=${expected_sha}" <<<"${release}"; then
              break
            fi
            sleep 10
          done
          grep -Fq "GIT_SHA=${expected_sha}" <<<"${release}"
          grep -Fq 'PROGRAM_COUNT=26' <<<"${release}"

          home="$(fetch /)"
          grep -Fq '<b>26</b><span>foglalkozás és képzés</span>' <<<"${home}"
          data="$(fetch /data.js)"
          grep -Fq 'id:"schweden-1"' <<<"${data}"
          grep -Fq 'when:"Minden szombaton 10:00–12:00"' <<<"${data}"
          grep -Fq 'id:"schweden-2"' <<<"${data}"
          grep -Fq 'when:"Kéthetente szombatonként 12:00–14:00"' <<<"${data}"
          grep -Fq 'id:"rekreacio"' <<<"${data}"
          app="$(fetch /app.js)"
          grep -Fq 'Nincs megfelelő BMI-találat' <<<"${app}"

          for path in / /foglalkozasok.html /korosztalyok.html /gyik.html /data.js /app.js /catalog.js /release.txt /version.json; do
            fetch "${path}" >/dev/null
          done
          echo "EXACT-LIVE: ${expected_sha} is serving on ${base}."
