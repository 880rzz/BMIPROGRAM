name: Deploy BMIPROGRAM to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PRODUCTION_URL: https://programvalaszto.magyariskola.at

concurrency:
  group: bmi-production
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check data.js
          node --check app.js
          node --check catalog.js
          node --check scripts/validate.mjs
          node --check scripts/validate-schema-age.mjs
          node --check scripts/validate-matching.mjs
          node --check scripts/validate-copy.mjs
          node --check scripts/validate-design.mjs
      - name: Canonical integrity
        run: node scripts/validate.mjs
      - name: Schema age semantics
        run: node scripts/validate-schema-age.mjs
      - name: Exhaustive selector state space
        run: node scripts/validate-matching.mjs
      - name: Recommender copy and UX consistency
        run: node scripts/validate-copy.mjs
      - name: Monochrome design-system integrity
        run: node scripts/validate-design.mjs
      - name: Release-critical finder contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "cfg.days=[" app.js
          grep -Fq "{id:'hetfo',label:'Hétfő'}" app.js
          grep -Fq "{id:'szombat',label:'Szombat'}" app.js
          grep -Fq "(p.weekdays||[p.weekday]).indexOf(state.day)!==-1" app.js
          grep -Fq "if(!ageEligible(p))return-1" app.js
          grep -Fq "if(interestEligible(p))score+=60" app.js
          grep -Fq "if(dayEligible(p))score+=25" app.js
          grep -Fq "if(paceEligible(p))score+=15" app.js
          grep -Fq "Ami eltér:" app.js
          grep -Fq "Hány éves, akinek foglalkozást keresel?" app.js
          grep -Fq "Mind a 23 foglalkozás" app.js
          grep -Fq "https://ungarischlernen.at" app.js
          grep -Fq "https://amaped.at" app.js
          grep -Fq "Expected 10500 combinations" scripts/validate-matching.mjs
          grep -Fq 'name:"Sakk és Gondolkodásfejlesztés | Schwedenplatz"' data.js
          grep -Fq 'when:"Havonta 1 alkalommal, szombatonként 13:00–15:00"' data.js

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'scripts/' \
            --exclude '_site/' \
            --exclude 'release.txt' \
            --exclude 'version.json'
          short_sha="${GITHUB_SHA::12}"
          release_date="$(date -u +'%Y-%m-%d')"
          built_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          release_id="${release_date}-${short_sha}"

          # Every release gets immutable asset URLs. This prevents mobile Safari from serving an older design.
          for html in _site/*.html; do
            sed -E -i "s#ui-20260821\.css\?v=[^\"']+#ui-20260821.css?v=${short_sha}#g" "$html"
            sed -E -i "s#recommendation-polish\.css\?v=[^\"']+#recommendation-polish.css?v=${short_sha}#g" "$html"
            sed -E -i 's#<meta name="theme-color" content="#[0-9A-Fa-f]{6}">#<meta name="theme-color" content="#ffffff">#g' "$html"
          done
          sed -i '/preload.*vienna-skyline/d' _site/index.html

          cat > _site/release.txt <<EOF
          BMIPROGRAM_RELEASE=${release_id}
          GIT_SHA=${GITHUB_SHA}
          SCHOOL_YEAR=2026/2027
          PROGRAM_COUNT=23
          SOURCE_POLICY=canonical-current-2026-27-only
          RECOMMENDER=ranked-exact-first-age-hard
          DESIGN_SYSTEM=monochrome-editorial-v1
          BUILT_AT=${built_at}
          EOF
          cat > _site/version.json <<EOF
          {"release":"${release_id}","gitSha":"${GITHUB_SHA}","schoolYear":"2026/2027","programCount":23,"sourcePolicy":"canonical-current-2026-27-only","recommender":"ranked-exact-first-age-hard","designSystem":"monochrome-editorial-v1","builtAt":"${built_at}"}
          EOF
          test -f _site/index.html
          test -f _site/data.js
          test -f _site/app.js
          test -f _site/logo.png
          test -f _site/favicon_.png
          test -f _site/CNAME
          test -f _site/.nojekyll
          test "$(cat _site/CNAME)" = "programvalaszto.magyariskola.at"
          grep -Fq "GIT_SHA=${GITHUB_SHA}" _site/release.txt
          grep -Fq 'PROGRAM_COUNT=23' _site/release.txt
          grep -Fq 'DESIGN_SYSTEM=monochrome-editorial-v1' _site/release.txt
          grep -Fq "ui-20260821.css?v=${short_sha}" _site/index.html
          grep -Fq "recommendation-polish.css?v=${short_sha}" _site/index.html
          grep -Fq 'content="#ffffff"' _site/index.html
          grep -Fq 'src="logo.png"' _site/index.html
          grep -Fq 'href="favicon_.png"' _site/index.html
          grep -Fq 'BMIPROGRAM — monochrome editorial design system' _site/ui-20260821.css
          ! grep -Fq -- '--summer-' _site/ui-20260821.css
          ! grep -Fq 'linear-gradient(' _site/ui-20260821.css
          grep -Fq 'Sakk és Gondolkodásfejlesztés | Schwedenplatz' _site/data.js
          grep -Fq 'https://www.magyariskola.at/event-details/sakk-2026' _site/data.js
          grep -Fq 'https://ungarischlernen.at' _site/app.js
          grep -Fq 'https://amaped.at' _site/app.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy exact artifact
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact production release
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="${GITHUB_SHA}"
          short_sha="${GITHUB_SHA::12}"
          base="${PRODUCTION_URL%/}"
          fetch() {
            local path="$1"
            curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "${base}${path}?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          }
          release=''
          for attempt in $(seq 1 30); do
            if release="$(fetch /release.txt 2>/dev/null)" && grep -Fq "GIT_SHA=${expected_sha}" <<<"${release}"; then
              break
            fi
            echo "Production has not converged to ${expected_sha} yet (attempt ${attempt}/30)."
            sleep 10
          done
          grep -Fq "GIT_SHA=${expected_sha}" <<<"${release}"
          grep -Fq 'PROGRAM_COUNT=23' <<<"${release}"
          grep -Fq 'SOURCE_POLICY=canonical-current-2026-27-only' <<<"${release}"
          grep -Fq 'RECOMMENDER=ranked-exact-first-age-hard' <<<"${release}"
          grep -Fq 'DESIGN_SYSTEM=monochrome-editorial-v1' <<<"${release}"

          home="$(fetch /)"
          grep -Fq 'Foglalkozásválasztó 2026/27' <<<"${home}"
          grep -Fq 'Magyar foglalkozások' <<<"${home}"
          grep -Fq 'kicsiknek és nagyoknak.' <<<"${home}"
          grep -Fq '23</b><span>foglalkozás' <<<"${home}"
          grep -Fq 'Gyermeknek keresel délutáni vagy hétvégi magyar foglalkozást? Vagy saját magadnak választanál?' <<<"${home}"
          grep -Fq 'A Bécsi Magyar Iskola nem egész napos iskola.' <<<"${home}"
          grep -Fq "ui-20260821.css?v=${short_sha}" <<<"${home}"
          grep -Fq "recommendation-polish.css?v=${short_sha}" <<<"${home}"
          grep -Fq 'content="#ffffff"' <<<"${home}"
          grep -Fq 'src="logo.png"' <<<"${home}"
          grep -Fq 'href="favicon_.png"' <<<"${home}"

          ui="$(fetch /ui-20260821.css)"
          grep -Fq 'BMIPROGRAM — monochrome editorial design system' <<<"${ui}"
          grep -Fq 'font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif' <<<"${ui}"
          grep -Fq '.hero .vienna-skyline{display:none!important}' <<<"${ui}"
          grep -Fq 'background:var(--black)!important' <<<"${ui}"
          ! grep -Fq -- '--summer-' <<<"${ui}"
          ! grep -Fq 'linear-gradient(' <<<"${ui}"

          data="$(fetch /data.js)"
          grep -Fq 'schoolYear:"2026/2027"' <<<"${data}"
          grep -Fq 'excludePriorYearWix:true' <<<"${data}"
          grep -Fq 'name:"Sakk és Gondolkodásfejlesztés | Schwedenplatz"' <<<"${data}"
          grep -Fq 'firstDate:"2026. szeptember 26."' <<<"${data}"
          grep -Fq 'registrationDeadline:"2026. szeptember 25."' <<<"${data}"

          app="$(fetch /app.js)"
          grep -Fq "{id:'hetfo',label:'Hétfő'}" <<<"${app}"
          grep -Fq "{id:'szombat',label:'Szombat'}" <<<"${app}"
          grep -Fq "if(!ageEligible(p))return-1" <<<"${app}"
          grep -Fq "if(interestEligible(p))score+=60" <<<"${app}"
          grep -Fq 'Ami eltér:' <<<"${app}"
          grep -Fq 'Hány éves, akinek foglalkozást keresel?' <<<"${app}"
          grep -Fq 'Mind a 23 foglalkozás' <<<"${app}"
          grep -Fq 'https://ungarischlernen.at' <<<"${app}"
          grep -Fq 'https://amaped.at' <<<"${app}"

          faq="$(fetch /gyik.html)"
          grep -Fq 'életkor kemény feltétel' <<<"${faq}"
          grep -Fq 'legközelebbi BMI-alternatívákat' <<<"${faq}"
          grep -Fq 'Sakk és Gondolkodásfejlesztés' <<<"${faq}"

          version="$(fetch /version.json)"
          grep -Fq "\"gitSha\":\"${expected_sha}\"" <<<"${version}"
          grep -Fq '"programCount":23' <<<"${version}"
          grep -Fq '"designSystem":"monochrome-editorial-v1"' <<<"${version}"

          for path in / /foglalkozasok.html /korosztalyok.html /gyik.html /data.js /app.js /catalog.js /ui-20260821.css /recommendation-polish.css /logo.png /favicon_.png /llms.txt /llms-full.txt /robots.txt /sitemap.xml /release.txt /version.json; do
            fetch "${path}" >/dev/null
          done
          echo "EXACT-LIVE: ${expected_sha} is serving on ${base}."
