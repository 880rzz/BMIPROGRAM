name: Deploy BMIPROGRAM to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PRODUCTION_URL: https://programvalaszto.magyariskola.at

concurrency:
  group: bmi-production
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          for f in data.js zenebona-program.js app.js privacy-runtime.js route-map.js address-autocomplete.js catalog.js whatsapp-widget.js finder-runtime.js transit-routing.js google-routes.js routes-config.js result-travel-polish.js wizard-anchor.js result-actions.js scripts/validate.mjs scripts/validate-schema-age.mjs scripts/validate-matching.mjs scripts/validate-copy.mjs scripts/browser-e2e.mjs audit/finder-integrity-audit.js audit/live-reality-audit.mjs; do node --check "$f"; done
      - name: Registry, finder, privacy and UX validation
        run: |
          set -euo pipefail
          node scripts/validate.mjs
          node scripts/validate-schema-age.mjs
          node scripts/validate-matching.mjs
          node scripts/validate-copy.mjs
          node audit/finder-integrity-audit.js
      - name: Live source reality audit
        run: |
          set -euo pipefail
          node audit/live-reality-audit.mjs || (sleep 8 && node audit/live-reality-audit.mjs)
      - name: Release contracts
        run: |
          set -euo pipefail
          grep -Fq 'id:"zenebona"' zenebona-program.js
          grep -Fq 'id:"oromzene"' zenebona-program.js
          grep -Fq 'selectedDays' app.js
          grep -Fq 'selectedPaces' app.js
          grep -Fq 'identifiedOrigin(input)' app.js
          grep -Fq 'BMI_PRIVACY_LOCAL=true' privacy-runtime.js
          grep -Fq 'BMI_MAP_CONSENT=false' privacy-runtime.js
          grep -Fq 'BMI_SET_MAP_CONSENT' privacy-runtime.js
          grep -Fq 'routes.googleapis.com' privacy-runtime.js
          grep -Fq 'explicit map/routing consent' privacy-runtime.js
          grep -Fq 'BMI_LOCAL_LOCATION' address-autocomplete.js
          grep -Fq 'mapConsent' address-autocomplete.js
          grep -Fq 'photon.komoot.io' address-autocomplete.js
          grep -Fq 'limit=3' address-autocomplete.js
          grep -Fq 'Google Maps Platform Routes' address-autocomplete.js
          grep -Fq 'routeData(card)' route-map.js
          grep -Fq 'Térkép és útvonal' route-map.js
          grep -Fq 'mapSvg(data)' route-map.js
          grep -Fq 'osmEmbedUrl' route-map.js
          grep -Fq 'openstreetmap.org/export/embed.html' route-map.js
          grep -Fq 'BMI_MAP_CONSENT===true' route-map.js
          grep -Fq 'routes.googleapis.com/directions/v2:computeRoutes' google-routes.js
          grep -Fq "routingPreference='TRAFFIC_AWARE_OPTIMAL'" google-routes.js
          grep -Fq "trafficModel='BEST_GUESS'" google-routes.js
          grep -Fq 'BMI_GOOGLE_ROUTES_API_KEY' google-routes.js
          grep -Fq 'BMI_GOOGLE_ROUTES_API_KEY' routes-config.js
          ! grep -Eq 'AIza[0-9A-Za-z_-]{20,}' routes-config.js
          grep -Fq "p.id!=='zenebona'&&overlaps" catalog.js
          grep -Fq 'bmi-whatsapp-widget' whatsapp-widget.js
          grep -Fq 'bmi-hero-wordmark' whatsapp-widget.js
          grep -Fq 'opcionális térképes és pontos útvonal-hozzájárulással' whatsapp-widget.js
          ! grep -Fq 'transit-routing.js' whatsapp-widget.js
          ! grep -Fq 'wizard-responsive.css' whatsapp-widget.js
          grep -Fq 'wizard-responsive.css?v=' finder-runtime.js
          grep -Fq 'wizard-anchor.js?v=' finder-runtime.js
          grep -Fq 'result-actions.js?v=' finder-runtime.js
          grep -Fq 'routes-config.js?v=' finder-runtime.js
          grep -Fq 'transit-routing.js?v=' finder-runtime.js
          grep -Fq 'google-routes.js?v=' finder-runtime.js
          grep -Fq 'result-travel-polish.js?v=' finder-runtime.js
          grep -Fq 'nextOccurrence' transit-routing.js
          grep -Fq "providerStatus:'approximate-planning-range'" transit-routing.js
          grep -Fq 'routeProvider' result-travel-polish.js
          grep -Fq 'Google Routes' result-travel-polish.js
          grep -Fq 'travelPanelSignature' result-travel-polish.js
          grep -Fq -- '-webkit-text-size-adjust:100%' wizard-responsive.css
          grep -Fq 'font-size:16px!important' wizard-responsive.css
          grep -Fq 'repeat(3,minmax(0,1fr))' wizard-responsive.css
          grep -Fq 'white-space:nowrap!important' wizard-responsive.css
          grep -Fq 'height:54px!important' wizard-responsive.css
          grep -Fq 'has-long-action' result-actions.js
          grep -Fq 'scrollToCurrentBlock' wizard-anchor.js
          grep -Fq 'subtree:false' wizard-anchor.js
          grep -Fq '.hero-identity' recommendation-polish.css
          grep -Fq 'text-wrap:balance' recommendation-polish.css
          grep -Fq 'privacy-runtime.js?v=' index.html
          grep -Fq 'finder-runtime.js?v=' index.html
          ! grep -Fq 'homepage-polish.js' index.html
          ! test -e homepage-polish.js
          ! test -e typography-polish.css
          ! test -e bmi-header-logo-fixed.png
          ! test -e favicon_.png
          ! test -e logo.png
          grep -Eq '<lastmod>2026-09-(0[4-9]|[12][0-9]|30)</lastmod>' sitemap.xml
          ! grep -Fq '## Zenebona canonical rekord' llms-full.txt
          for html in index.html foglalkozasok.html korosztalyok.html gyik.html; do
            grep -Fq 'viewport-fit=cover' "$html"
            grep -Fq 'bmi-header-logo.png' "$html"
            grep -Fq 'bmi_blue_round_rgb_logo.svg' "$html"
            grep -Fq 'Délutáni és hétvégi foglalkozások · 2026 / 2027' "$html"
            grep -Fq 'whatsapp-widget.js?v=' "$html"
            grep -Fq 'marketing@kozpontiszovetseg.at' "$html"
            grep -Fq 'footer-trust' "$html"
            grep -Fq 'Privát működés' "$html"
          done
          ! grep -Fq 'Zenebona' index.html
          ! grep -Fq 'Zenebona' korosztalyok.html
          ! grep -Fq 'Zenebona' gyik.html
          echo 'PASS: default-private consent, precise-routing provider contract, address suggestions, real map, finder and responsive UX are intact.'

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build immutable Pages artifact
        shell: bash
        env:
          GOOGLE_ROUTES_API_KEY: ${{ secrets.GOOGLE_ROUTES_API_KEY }}
        run: |
          set -euo pipefail
          rm -rf _site && mkdir _site
          rsync -a ./ _site/ --exclude '.git/' --exclude '.github/' --exclude 'scripts/' --exclude 'audit/output/' --exclude '_site/' --exclude 'release.txt' --exclude 'version.json'
          short_sha="${GITHUB_SHA::12}"
          release_date="$(date -u +'%Y-%m-%d')"
          built_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          release_id="${release_date}-${short_sha}"
          if [ -n "${GOOGLE_ROUTES_API_KEY:-}" ]; then precision_status='google-routes-configured'; else precision_status='local-fallback'; fi
          node <<'NODE'
          const fs=require('fs');
          const key=process.env.GOOGLE_ROUTES_API_KEY||'';
          fs.writeFileSync('_site/routes-config.js', `(function(){\n'use strict';\nwindow.BMI_GOOGLE_ROUTES_API_KEY=${JSON.stringify(key)};\nwindow.BMI_PRECISE_ROUTING_PROVIDER='google-routes';\n})();\n`);
          NODE
          for html in _site/*.html; do
            sed -E -i "s#styles\.css\?v=[^\"']+#styles.css?v=${short_sha}#g; s#ui-20260821\.css\?v=[^\"']+#ui-20260821.css?v=${short_sha}#g; s#recommendation-polish\.css\?v=[^\"']+#recommendation-polish.css?v=${short_sha}#g; s#data\.js\?v=[^\"']+#data.js?v=${short_sha}#g; s#app\.js\?v=[^\"']+#app.js?v=${short_sha}#g; s#privacy-runtime\.js\?v=[^\"']+#privacy-runtime.js?v=${short_sha}#g; s#route-map\.js\?v=[^\"']+#route-map.js?v=${short_sha}#g; s#address-autocomplete\.js\?v=[^\"']+#address-autocomplete.js?v=${short_sha}#g; s#catalog\.js\?v=[^\"']+#catalog.js?v=${short_sha}#g; s#zenebona-program\.js\?v=[^\"']+#zenebona-program.js?v=${short_sha}#g; s#whatsapp-widget\.js\?v=[^\"']+#whatsapp-widget.js?v=${short_sha}#g; s#finder-runtime\.js\?v=[^\"']+#finder-runtime.js?v=${short_sha}#g" "$html"
          done
          sed -E -i "s#wizard-responsive\.css\?v=[^\"']+#wizard-responsive.css?v=${short_sha}#g; s#wizard-anchor\.js\?v=[^\"']+#wizard-anchor.js?v=${short_sha}#g; s#result-actions\.js\?v=[^\"']+#result-actions.js?v=${short_sha}#g; s#routes-config\.js\?v=[^\"']+#routes-config.js?v=${short_sha}#g; s#transit-routing\.js\?v=[^\"']+#transit-routing.js?v=${short_sha}#g; s#google-routes\.js\?v=[^\"']+#google-routes.js?v=${short_sha}#g; s#result-travel-polish\.js\?v=[^\"']+#result-travel-polish.js?v=${short_sha}#g" _site/finder-runtime.js
          cat > _site/release.txt <<EOF
          BMIPROGRAM_RELEASE=${release_id}
          GIT_SHA=${GITHUB_SHA}
          SCHOOL_YEAR=2026/2027
          PROGRAM_COUNT=28
          SOURCE_POLICY=canonical-current-2026-27-only
          PRIVACY=default-private-explicit-map-routing-consent-no-analytics-no-tracking-no-client-storage
          ROUTING_PRECISION=${precision_status}
          RECOMMENDER=age-hard-multineed-multiday-multipace-consent-location-routing-three-mode-ranges-google-routes-fallback-real-map-mobile-anchor-spacious-actions-ios-browser-e2e
          BUILT_AT=${built_at}
          EOF
          cat > _site/version.json <<EOF
          {"release":"${release_id}","gitSha":"${GITHUB_SHA}","schoolYear":"2026/2027","programCount":28,"sourcePolicy":"canonical-current-2026-27-only","privacy":"default-private-explicit-map-routing-consent-no-analytics-no-tracking-no-client-storage","routingPrecision":"${precision_status}","recommender":"age-hard-multineed-multiday-multipace-consent-location-routing-three-mode-ranges-google-routes-fallback-real-map-mobile-anchor-spacious-actions-ios-browser-e2e","builtAt":"${built_at}"}
          EOF
          test -f _site/index.html
          test -f _site/app.js
          test -f _site/privacy-runtime.js
          test -f _site/finder-runtime.js
          test -f _site/routes-config.js
          test -f _site/google-routes.js
          test -f _site/transit-routing.js
          test -f _site/result-travel-polish.js
          test -f _site/route-map.js
          test -f _site/wizard-responsive.css
          test -f _site/wizard-anchor.js
          test -f _site/result-actions.js
          test -f _site/recommendation-polish.css
          test -f _site/whatsapp-widget.js
          test "$(cat _site/CNAME)" = "programvalaszto.magyariskola.at"
          grep -Fq 'PROGRAM_COUNT=28' _site/release.txt
          grep -Fq 'PRIVACY=default-private-explicit-map-routing-consent-no-analytics-no-tracking-no-client-storage' _site/release.txt
          grep -Fq 'ROUTING_PRECISION=' _site/release.txt
          grep -Fq 'privacy-runtime.js?v=' _site/index.html
          grep -Fq 'finder-runtime.js?v=' _site/index.html
          grep -Fq 'routes-config.js?v=' _site/finder-runtime.js
          grep -Fq 'google-routes.js?v=' _site/finder-runtime.js
          grep -Fq 'wizard-responsive.css?v=' _site/finder-runtime.js
          grep -Fq 'mapSvg(data)' _site/route-map.js
          grep -Fq 'osmEmbedUrl' _site/route-map.js
          ! grep -Fq 'wizard-responsive.css' _site/whatsapp-widget.js
      - name: Browser E2E on built artifact
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory _site >/tmp/bmi-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          E2E_BASE=http://127.0.0.1:4173 node scripts/browser-e2e.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy exact artifact
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact production release
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="${GITHUB_SHA}"
          base="${PRODUCTION_URL%/}"
          fetch() { curl --fail --silent --show-error --location --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "${base}$1?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; }
          release=''
          for attempt in $(seq 1 30); do
            if release="$(fetch /release.txt 2>/dev/null)" && grep -Fq "GIT_SHA=${expected_sha}" <<<"${release}"; then break; fi
            sleep 10
          done
          grep -Fq "GIT_SHA=${expected_sha}" <<<"${release}"
          grep -Fq 'PROGRAM_COUNT=28' <<<"${release}"
          grep -Fq 'PRIVACY=default-private-explicit-map-routing-consent-no-analytics-no-tracking-no-client-storage' <<<"${release}"
          grep -Fq 'ROUTING_PRECISION=' <<<"${release}"
          home="$(fetch /)"
          grep -Fq 'Microsoft Office Specialist' <<<"${home}"
          grep -Fq 'privacy-runtime.js?v=' <<<"${home}"
          grep -Fq 'finder-runtime.js?v=' <<<"${home}"
          grep -Fq 'Privát működés' <<<"${home}"
          ! grep -Fq 'Zenebona' <<<"${home}"
          ! grep -Fq 'homepage-polish.js' <<<"${home}"
          privacy="$(fetch /privacy-runtime.js)"
          grep -Fq 'BMI_PRIVACY_LOCAL=true' <<<"${privacy}"
          grep -Fq 'BMI_MAP_CONSENT=false' <<<"${privacy}"
          grep -Fq 'routes.googleapis.com' <<<"${privacy}"
          runtime="$(fetch /finder-runtime.js)"
          grep -Fq 'routes-config.js?v=' <<<"${runtime}"
          grep -Fq 'google-routes.js?v=' <<<"${runtime}"
          precise="$(fetch /google-routes.js)"
          grep -Fq 'routes.googleapis.com/directions/v2:computeRoutes' <<<"${precise}"
          grep -Fq "TRAFFIC_AWARE_OPTIMAL" <<<"${precise}"
          config="$(fetch /routes-config.js)"
          grep -Fq 'BMI_GOOGLE_ROUTES_API_KEY' <<<"${config}"
          wa="$(fetch /whatsapp-widget.js)"
          grep -Fq 'bmi-whatsapp-widget' <<<"${wa}"
          grep -Fq 'bmi-hero-wordmark' <<<"${wa}"
          grep -Fq 'opcionális térképes és pontos útvonal-hozzájárulással' <<<"${wa}"
          ! grep -Fq 'transit-routing.js' <<<"${wa}"
          route="$(fetch /route-map.js)"
          grep -Fq 'mapSvg(data)' <<<"${route}"
          grep -Fq 'osmEmbedUrl' <<<"${route}"
          grep -Fq 'openstreetmap.org/export/embed.html' <<<"${route}"
          address="$(fetch /address-autocomplete.js)"
          grep -Fq 'mapConsent' <<<"${address}"
          grep -Fq 'photon.komoot.io' <<<"${address}"
          grep -Fq 'limit=3' <<<"${address}"
          grep -Fq 'Google Maps Platform Routes' <<<"${address}"
          sitemap="$(fetch /sitemap.xml)"
          grep -Eq '<lastmod>2026-09-(0[4-9]|[12][0-9]|30)</lastmod>' <<<"${sitemap}"
          llmfull="$(fetch /llms-full.txt)"
          ! grep -Fq '## Zenebona canonical rekord' <<<"${llmfull}"
          for path in / /foglalkozasok.html /korosztalyok.html /gyik.html; do
            page="$(fetch "${path}")"
            grep -Fq 'viewport-fit=cover' <<<"${page}"
            grep -Fq 'bmi-header-logo.png' <<<"${page}"
            grep -Fq 'whatsapp-widget.js?v=' <<<"${page}"
            grep -Fq 'Privát működés' <<<"${page}"
          done
      - name: Browser E2E on production
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          E2E_BASE="${PRODUCTION_URL%/}" node scripts/browser-e2e.mjs
      - name: Release complete
        run: |
          echo "EXACT-LIVE: ${GITHUB_SHA} passed data integrity, source reality, default-private consent, optional Google Routes precision, exact deploy and production browser E2E."
