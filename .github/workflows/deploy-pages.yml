name: Deploy BMIPROGRAM to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PRODUCTION_URL: https://programvalaszto.magyariskola.at

concurrency:
  group: bmi-production
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --check data.js
          node --check zenebona-program.js
          node --check app.js
          node --check route-map.js
          node --check address-autocomplete.js
          node --check catalog.js
          node --check whatsapp-widget.js
          node --check transit-routing.js
          node --check result-travel-polish.js
          node --check scripts/validate.mjs
          node --check scripts/validate-schema-age.mjs
          node --check scripts/validate-matching.mjs
          node --check scripts/validate-copy.mjs
          node --check scripts/live-transit-probe.mjs
      - name: Recommendation and registry validation
        run: |
          set -euo pipefail
          node scripts/validate.mjs
          node scripts/validate-schema-age.mjs
          node scripts/validate-matching.mjs
          node scripts/validate-copy.mjs
      - name: Live Vienna transit probe
        run: node scripts/live-transit-probe.mjs
      - name: Partner and recommender release contracts
        run: |
          set -euo pipefail
          grep -Fq 'id:"zenebona"' zenebona-program.js
          grep -Fq 'url:"https://zenebona.magyariskola.at"' zenebona-program.js
          grep -Fq 'fee:"150 € / 10 alkalom"' zenebona-program.js
          grep -Fq 'paymentDeadline:"2026. október 1."' zenebona-program.js
          grep -Fq 'id:"oromzene"' zenebona-program.js
          grep -Fq 'eventDates' zenebona-program.js
          grep -Fq 'selectedDays' app.js
          grep -Fq 'selectedPaces' app.js
          grep -Fq "'days',3" app.js
          grep -Fq "'paces',2" app.js
          grep -Fq 'data-mode="transit"' app.js
          grep -Fq 'identifiedOrigin(input)' app.js
          grep -Fq 'data-route-origin-lat' app.js
          grep -Fq 'routeData(card)' route-map.js
          grep -Fq 'overview=full&geometries=geojson' route-map.js
          grep -Fq 'countrycode=AT' address-autocomplete.js
          grep -Fq 'Azonosított cím:' address-autocomplete.js
          grep -Fq 'bmi-whatsapp-widget' whatsapp-widget.js
          grep -Fq 'transit-routing.js?v=' whatsapp-widget.js
          grep -Fq 'result-travel-polish.js?v=' whatsapp-widget.js
          grep -Fq 'fahrplan.oebb.at/bin/mgate.exe' transit-routing.js
          grep -Fq 'LocGeoPos' transit-routing.js
          grep -Fq 'outFrwd:false' transit-routing.js
          grep -Fq 'target-60' transit-routing.js
          grep -Fq 'Átlagos menetidő' result-travel-polish.js
          grep -Fq 'container-type:inline-size' result-travel-polish.js
          grep -Fq 'Nem a keresés pillanatát használjuk.' result-travel-polish.js
          for html in index.html foglalkozasok.html korosztalyok.html gyik.html; do
            grep -Fq 'whatsapp-widget.js?v=' "$html"
            grep -Fq 'marketing@kozpontiszovetseg.at' "$html"
            grep -Fq 'Be Smart Kids Club csapata' "$html"
            grep -Fq 'https://business.vipach.at' "$html"
          done
          ! grep -Fq '<h4>Zenebona</h4>' gyik.html
          grep -Fq '28 aktuális' llms.txt
          echo 'PASS: scheduled ÖBB transit, responsive travel panel and recommender contracts are intact.'

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'scripts/' \
            --exclude '_site/' \
            --exclude 'release.txt' \
            --exclude 'version.json'

          short_sha="${GITHUB_SHA::12}"
          release_date="$(date -u +'%Y-%m-%d')"
          built_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          release_id="${release_date}-${short_sha}"

          for html in _site/*.html; do
            sed -E -i "s#styles\.css\?v=[^\"']+#styles.css?v=${short_sha}#g" "$html"
            sed -E -i "s#ui-20260821\.css\?v=[^\"']+#ui-20260821.css?v=${short_sha}#g" "$html"
            sed -E -i "s#recommendation-polish\.css\?v=[^\"']+#recommendation-polish.css?v=${short_sha}#g" "$html"
            sed -E -i "s#data\.js\?v=[^\"']+#data.js?v=${short_sha}#g" "$html"
            sed -E -i "s#app\.js\?v=[^\"']+#app.js?v=${short_sha}#g" "$html"
            sed -E -i "s#route-map\.js\?v=[^\"']+#route-map.js?v=${short_sha}#g" "$html"
            sed -E -i "s#address-autocomplete\.js\?v=[^\"']+#address-autocomplete.js?v=${short_sha}#g" "$html"
            sed -E -i "s#catalog\.js\?v=[^\"']+#catalog.js?v=${short_sha}#g" "$html"
            sed -E -i "s#zenebona-program\.js\?v=[^\"']+#zenebona-program.js?v=${short_sha}#g" "$html"
            sed -E -i "s#whatsapp-widget\.js\?v=[^\"']+#whatsapp-widget.js?v=${short_sha}#g" "$html"
          done

          cat > _site/release.txt <<EOF
          BMIPROGRAM_RELEASE=${release_id}
          GIT_SHA=${GITHUB_SHA}
          SCHOOL_YEAR=2026/2027
          PROGRAM_COUNT=28
          SOURCE_POLICY=canonical-current-2026-27-only
          RECOMMENDER=age-hard-multineed-multiday-multipace-identified-address-route-scheduled-transit
          BUILT_AT=${built_at}
          EOF

          cat > _site/version.json <<EOF
          {"release":"${release_id}","gitSha":"${GITHUB_SHA}","schoolYear":"2026/2027","programCount":28,"sourcePolicy":"canonical-current-2026-27-only","recommender":"age-hard-multineed-multiday-multipace-identified-address-route-scheduled-transit","builtAt":"${built_at}"}
          EOF

          test -f _site/index.html
          test -f _site/app.js
          test -f _site/transit-routing.js
          test -f _site/result-travel-polish.js
          test -f _site/whatsapp-widget.js
          test "$(cat _site/CNAME)" = "programvalaszto.magyariskola.at"
          grep -Fq 'PROGRAM_COUNT=28' _site/release.txt
          grep -Fq 'fahrplan.oebb.at/bin/mgate.exe' _site/transit-routing.js
          grep -Fq 'Átlagos menetidő' _site/result-travel-polish.js
          for html in _site/index.html _site/foglalkozasok.html _site/korosztalyok.html _site/gyik.html; do grep -Fq 'whatsapp-widget.js?v=' "$html"; done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy exact artifact
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify production release and scheduled transit assets
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="${GITHUB_SHA}"
          base="${PRODUCTION_URL%/}"
          fetch() { curl --fail --silent --show-error --location --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "${base}$1?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; }
          release=''
          for attempt in $(seq 1 30); do
            if release="$(fetch /release.txt 2>/dev/null)" && grep -Fq "GIT_SHA=${expected_sha}" <<<"${release}"; then break; fi
            sleep 10
          done
          grep -Fq "GIT_SHA=${expected_sha}" <<<"${release}"
          grep -Fq 'PROGRAM_COUNT=28' <<<"${release}"
          app="$(fetch /app.js)"
          grep -Fq 'selectedDays' <<<"${app}"
          grep -Fq 'selectedPaces' <<<"${app}"
          wa="$(fetch /whatsapp-widget.js)"
          grep -Fq 'transit-routing.js?v=' <<<"${wa}"
          grep -Fq 'result-travel-polish.js?v=' <<<"${wa}"
          transit="$(fetch /transit-routing.js)"
          grep -Fq 'fahrplan.oebb.at/bin/mgate.exe' <<<"${transit}"
          grep -Fq 'LocGeoPos' <<<"${transit}"
          grep -Fq 'outFrwd:false' <<<"${transit}"
          grep -Fq 'target-60' <<<"${transit}"
          travel="$(fetch /result-travel-polish.js)"
          grep -Fq 'Átlagos menetidő' <<<"${travel}"
          grep -Fq 'container-type:inline-size' <<<"${travel}"
          for path in / /foglalkozasok.html /korosztalyok.html /gyik.html; do
            page="$(fetch "${path}")"
            grep -Fq 'whatsapp-widget.js?v=' <<<"${page}"
            grep -Fq 'marketing@kozpontiszovetseg.at' <<<"${page}"
          done
          for path in / /foglalkozasok.html /korosztalyok.html /gyik.html /app.js /transit-routing.js /result-travel-polish.js /whatsapp-widget.js /release.txt /version.json; do fetch "${path}" >/dev/null; done
          echo "EXACT-LIVE: ${expected_sha} serves scheduled ÖBB transit and responsive travel panel assets."
