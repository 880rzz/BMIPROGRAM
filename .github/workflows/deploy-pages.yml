name: Deploy BMIPROGRAM to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PRODUCTION_URL: https://programvalaszto.magyariskola.at

concurrency:
  group: bmi-production
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --check data.js
          node --check app.js
          node --check catalog.js
          node --check scripts/validate.mjs
          node --check scripts/validate-schema-age.mjs
          node --check scripts/validate-matching.mjs
          node --check scripts/validate-copy.mjs
          node --check scripts/validate-design.mjs

      - name: Advisory audits
        continue-on-error: true
        run: |
          node scripts/validate.mjs
          node scripts/validate-schema-age.mjs
          node scripts/validate-matching.mjs
          node scripts/validate-copy.mjs
          node scripts/validate-design.mjs

      - name: Release-critical hard contracts
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq "if(!ageEligible(p))return-1" app.js
          grep -Fq "if(interestEligible(p))score+=60" app.js
          grep -Fq "if(dayEligible(p))score+=25" app.js
          grep -Fq "if(paceEligible(p))score+=15" app.js
          grep -Fq "if(p.provider==='BMI')score+=2" app.js
          grep -Fq "Mind a 24 foglalkozás és képzés" app.js
          grep -Fq "https://ungarischlernen.at" app.js
          grep -Fq "https://amaped.at" app.js
          grep -Fq 'name:"Sakk és Gondolkodásfejlesztés | Schwedenplatz"' data.js
          grep -Fq 'when:"Havonta 1 alkalommal, szombatonként 13:00–15:00"' data.js
          grep -Fq 'schoolYear:"2026/2027"' data.js
          grep -Fq 'id:"mos"' data.js
          grep -Fq 'url:"https://mos.magyariskola.at"' data.js

          grep -Fq 'BMIPROGRAM — neutral structural foundation' styles.css
          grep -Fq 'background:linear-gradient(105deg,#0B57D0 0%,#245FB5 38%,#78642D 70%,#9A6400 100%)' styles.css
          test "$(grep -o 'linear-gradient(' styles.css | wc -l | tr -d ' ')" = "1"
          grep -Fq 'Contextual vector icon system' styles.css
          grep -Fq 'stroke="currentColor"' icons.svg
          grep -Fq 'stroke-width="1.7"' icons.svg

          grep -Fq 'BMIPROGRAM — human editorial monochrome design system' ui-20260821.css
          grep -Fq '.site-head .nav{display:none!important}' ui-20260821.css
          grep -Fq '.site-head .menu-btn{display:inline-flex!important' ui-20260821.css
          grep -Fq '.hero-identity{display:flex!important' ui-20260821.css
          grep -Fq '.hero-identity .hero-mark img{filter:none!important;opacity:1!important' ui-20260821.css
          grep -Fq '@media(max-width:720px){.hero-identity{flex-direction:column!important;align-items:flex-start!important' ui-20260821.css
          ! grep -Fq 'linear-gradient(' ui-20260821.css
          ! grep -Fq 'radial-gradient(' ui-20260821.css
          ! grep -Fq 'border-radius:999px' ui-20260821.css
          ! grep -Fq 'blur(20px)' ui-20260821.css
          ! grep -Fq 'linear-gradient(' recommendation-polish.css

          grep -Fq '<div class="hero-identity">' index.html
          grep -Fq '<div class="hero-mark"><img src="logo.png" alt="Bécsi Magyar Iskola"' index.html
          grep -Fq '<span class="hero-school-name">Bécsi Magyar Iskola</span>' index.html
          grep -Fq '<span class="hero-founded headline-accent">alapítva 1987</span>' index.html
          grep -Fq '<span class="eyebrow">2026 / 2027-es tanév</span>' index.html
          grep -Fq 'Magyar nyelvű <span class="headline-accent">foglalkozások</span>' index.html
          ! grep -Fq 'vienna-skyline' index.html
          ! grep -Fq '🦋' index.html
          ! grep -Fq ' style=' index.html

          for html in index.html foglalkozasok.html korosztalyok.html gyik.html; do
            grep -Fq '<meta name="theme-color" content="#ffffff">' "$html"
            grep -Fq 'styles.css?v=human-editorial-v2' "$html"
            grep -Fq 'ui-20260821.css?v=human-editorial-v2' "$html"
          done

          echo 'PASS: hero identity, hamburger navigation, recommender and design hard contracts are intact.'

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'scripts/' \
            --exclude '_site/' \
            --exclude 'release.txt' \
            --exclude 'version.json'

          short_sha="${GITHUB_SHA::12}"
          release_date="$(date -u +'%Y-%m-%d')"
          built_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          release_id="${release_date}-${short_sha}"

          for html in _site/*.html; do
            sed -E -i "s#styles\.css\?v=[^\"']+#styles.css?v=${short_sha}#g" "$html"
            sed -E -i "s#ui-20260821\.css\?v=[^\"']+#ui-20260821.css?v=${short_sha}#g" "$html"
            sed -E -i "s#recommendation-polish\.css\?v=[^\"']+#recommendation-polish.css?v=${short_sha}#g" "$html"
          done

          cat > _site/release.txt <<EOF
          BMIPROGRAM_RELEASE=${release_id}
          GIT_SHA=${GITHUB_SHA}
          SCHOOL_YEAR=2026/2027
          PROGRAM_COUNT=23
          SOURCE_POLICY=canonical-current-2026-27-only
          RECOMMENDER=ranked-exact-first-age-hard
          DESIGN_SYSTEM=human-editorial-v2
          BUILT_AT=${built_at}
          EOF

          cat > _site/version.json <<EOF
          {"release":"${release_id}","gitSha":"${GITHUB_SHA}","schoolYear":"2026/2027","programCount":23,"sourcePolicy":"canonical-current-2026-27-only","recommender":"ranked-exact-first-age-hard","designSystem":"human-editorial-v2","builtAt":"${built_at}"}
          EOF

          test -f _site/index.html
          test -f _site/data.js
          test -f _site/app.js
          test -f _site/catalog.js
          test -f _site/styles.css
          test -f _site/ui-20260821.css
          test -f _site/recommendation-polish.css
          test -f _site/icons.svg
          test -f _site/logo.png
          test -f _site/CNAME
          test "$(cat _site/CNAME)" = "programvalaszto.magyariskola.at"

          grep -Fq "GIT_SHA=${GITHUB_SHA}" _site/release.txt
          grep -Fq 'PROGRAM_COUNT=23' _site/release.txt
          grep -Fq 'DESIGN_SYSTEM=human-editorial-v2' _site/release.txt
          grep -Fq "styles.css?v=${short_sha}" _site/index.html
          grep -Fq "ui-20260821.css?v=${short_sha}" _site/index.html
          grep -Fq "recommendation-polish.css?v=${short_sha}" _site/index.html
          grep -Fq 'Magyar nyelvű <span class="headline-accent">foglalkozások</span>' _site/index.html
          grep -Fq '<span class="hero-founded headline-accent">alapítva 1987</span>' _site/index.html
          grep -Fq '.site-head .nav{display:none!important}' _site/ui-20260821.css
          grep -Fq '.hero-identity .hero-mark img{filter:none!important;opacity:1!important' _site/ui-20260821.css
          ! grep -Fq 'linear-gradient(' _site/ui-20260821.css
          ! grep -Fq 'border-radius:999px' _site/ui-20260821.css
          grep -Fq 'stroke="currentColor"' _site/icons.svg
          grep -Fq 'Sakk és Gondolkodásfejlesztés | Schwedenplatz' _site/data.js

          echo 'PASS: immutable production artifact contracts are intact.'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy exact artifact
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact production release
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="${GITHUB_SHA}"
          short_sha="${GITHUB_SHA::12}"
          base="${PRODUCTION_URL%/}"

          fetch() {
            local path="$1"
            curl --fail --silent --show-error --location --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "${base}${path}?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          }

          release=''
          for attempt in $(seq 1 30); do
            if release="$(fetch /release.txt 2>/dev/null)" && grep -Fq "GIT_SHA=${expected_sha}" <<<"${release}"; then
              break
            fi
            echo "Production has not converged to ${expected_sha} yet (attempt ${attempt}/30)."
            sleep 10
          done

          grep -Fq "GIT_SHA=${expected_sha}" <<<"${release}"
          grep -Fq 'PROGRAM_COUNT=23' <<<"${release}"
          grep -Fq 'DESIGN_SYSTEM=human-editorial-v2' <<<"${release}"

          home="$(fetch /)"
          grep -Fq 'Magyar nyelvű <span class="headline-accent">foglalkozások</span>' <<<"${home}"
          grep -Fq '<span class="hero-school-name">Bécsi Magyar Iskola</span>' <<<"${home}"
          grep -Fq '<span class="hero-founded headline-accent">alapítva 1987</span>' <<<"${home}"
          grep -Fq '<span class="eyebrow">2026 / 2027-es tanév</span>' <<<"${home}"
          grep -Fq "styles.css?v=${short_sha}" <<<"${home}"
          grep -Fq "ui-20260821.css?v=${short_sha}" <<<"${home}"

          ui="$(fetch /ui-20260821.css)"
          grep -Fq '.site-head .nav{display:none!important}' <<<"${ui}"
          grep -Fq '.site-head .menu-btn{display:inline-flex!important' <<<"${ui}"
          grep -Fq '.hero-identity .hero-mark img{filter:none!important;opacity:1!important' <<<"${ui}"
          grep -Fq '@media(max-width:720px){.hero-identity{flex-direction:column!important;align-items:flex-start!important' <<<"${ui}"
          ! grep -Fq 'linear-gradient(' <<<"${ui}"

          basecss="$(fetch /styles.css)"
          grep -Fq 'background:linear-gradient(105deg,#0B57D0 0%,#245FB5 38%,#78642D 70%,#9A6400 100%)' <<<"${basecss}"
          grep -Fq 'Contextual vector icon system' <<<"${basecss}"

          iconset="$(fetch /icons.svg)"
          grep -Fq 'stroke="currentColor"' <<<"${iconset}"
          grep -Fq 'stroke-width="1.7"' <<<"${iconset}"

          version="$(fetch /version.json)"
          grep -Fq "\"gitSha\":\"${expected_sha}\"" <<<"${version}"
          grep -Fq '"programCount":23' <<<"${version}"

          for path in / /foglalkozasok.html /korosztalyok.html /gyik.html /data.js /app.js /catalog.js /styles.css /ui-20260821.css /recommendation-polish.css /icons.svg /logo.png /release.txt /version.json; do
            fetch "${path}" >/dev/null
          done

          echo "EXACT-LIVE: ${expected_sha} is serving on ${base}."
