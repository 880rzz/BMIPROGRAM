name: Deploy BMIPROGRAM to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PRODUCTION_URL: https://programvalaszto.magyariskola.at

concurrency:
  group: bmi-production
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          for f in data.js zenebona-program.js app.js route-map.js address-autocomplete.js catalog.js whatsapp-widget.js transit-routing.js result-travel-polish.js wizard-anchor.js result-actions.js scripts/validate.mjs scripts/validate-schema-age.mjs scripts/validate-matching.mjs scripts/validate-copy.mjs; do node --check "$f"; done
      - name: Recommendation, registry, shell and mobile UX validation
        run: |
          set -euo pipefail
          node scripts/validate.mjs
          node scripts/validate-schema-age.mjs
          node scripts/validate-matching.mjs
          node scripts/validate-copy.mjs
      - name: Release contracts
        run: |
          set -euo pipefail
          grep -Fq 'id:"zenebona"' zenebona-program.js
          grep -Fq 'id:"oromzene"' zenebona-program.js
          grep -Fq 'selectedDays' app.js
          grep -Fq 'selectedPaces' app.js
          grep -Fq 'identifiedOrigin(input)' app.js
          grep -Fq 'routeData(card)' route-map.js
          grep -Fq 'Térkép és útvonal' route-map.js
          grep -Fq "dashArray:'8 8'" route-map.js
          grep -Fq 'countrycode=AT' address-autocomplete.js
          grep -Fq "p.id!=='zenebona'&&overlaps" catalog.js
          grep -Fq 'bmi-whatsapp-widget' whatsapp-widget.js
          grep -Fq 'transit-routing.js?v=' whatsapp-widget.js
          grep -Fq 'result-travel-polish.js?v=' whatsapp-widget.js
          grep -Fq 'wizard-responsive.css?v=' whatsapp-widget.js
          grep -Fq 'wizard-anchor.js?v=' whatsapp-widget.js
          grep -Fq 'result-actions.js?v=' whatsapp-widget.js
          grep -Fq 'nextOccurrence' transit-routing.js
          grep -Fq 'windowFor' transit-routing.js
          grep -Fq 'haversineKm' transit-routing.js
          grep -Fq 'transitEstimate' transit-routing.js
          grep -Fq "providerStatus:'approximate-planning-range'" transit-routing.js
          grep -Fq 'transitMinMinutes' transit-routing.js
          grep -Fq 'transitMaxMinutes' transit-routing.js
          grep -Fq 'Várható menetidő' result-travel-polish.js
          grep -Fq 'travelPanelSignature' result-travel-polish.js
          grep -Fq "t.closest&&t.closest('.result-travel')" result-travel-polish.js
          grep -Fq -- '-webkit-text-size-adjust:100%' wizard-responsive.css
          grep -Fq 'font-size:16px!important' wizard-responsive.css
          grep -Fq '.result-action-grid' wizard-responsive.css
          grep -Fq 'min-height:54px!important' wizard-responsive.css
          grep -Fq 'result-action-grid' result-actions.js
          grep -Fq 'action-wide' result-actions.js
          grep -Fq 'text.length>22' result-actions.js
          grep -Fq 'Mobile scaling' UX-RULES.md
          grep -Fq 'Action buttons' UX-RULES.md
          grep -Fq 'scrollToCurrentBlock' wizard-anchor.js
          grep -Fq 'subtree:false' wizard-anchor.js
          grep -Fq '.hero-identity' typography-polish.css
          for html in index.html foglalkozasok.html korosztalyok.html gyik.html; do
            grep -Fq 'Délutáni és hétvégi foglalkozások · 2026 / 2027' "$html"
            grep -Fq 'hero-identity' "$html"
            grep -Fq '1987–2027 · 40 éves BMI' "$html"
            grep -Fq 'Tanévbeszámoló' "$html"
            grep -Fq 'whatsapp-widget.js?v=' "$html"
            grep -Fq 'marketing@kozpontiszovetseg.at' "$html"
            grep -Fq 'Be Smart Kids Club csapata' "$html"
            grep -Fq 'https://business.vipach.at' "$html"
          done
          ! grep -Fq 'Zenebona' index.html
          ! grep -Fq 'Zenebona' korosztalyok.html
          ! grep -Fq 'Zenebona' gyik.html
          ! grep -Fq '## Zenebona' llms.txt
          grep -Fq '28 aktuális' llms.txt
          echo 'PASS: stable iOS scaling, equal responsive actions, spacious hierarchy, routing and shared shell contracts are intact.'

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site && mkdir _site
          rsync -a ./ _site/ --exclude '.git/' --exclude '.github/' --exclude 'scripts/' --exclude '_site/' --exclude 'release.txt' --exclude 'version.json'
          short_sha="${GITHUB_SHA::12}"
          release_date="$(date -u +'%Y-%m-%d')"
          built_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          release_id="${release_date}-${short_sha}"
          for html in _site/*.html; do
            sed -E -i "s#styles\.css\?v=[^\"']+#styles.css?v=${short_sha}#g; s#ui-20260821\.css\?v=[^\"']+#ui-20260821.css?v=${short_sha}#g; s#recommendation-polish\.css\?v=[^\"']+#recommendation-polish.css?v=${short_sha}#g; s#data\.js\?v=[^\"']+#data.js?v=${short_sha}#g; s#app\.js\?v=[^\"']+#app.js?v=${short_sha}#g; s#route-map\.js\?v=[^\"']+#route-map.js?v=${short_sha}#g; s#address-autocomplete\.js\?v=[^\"']+#address-autocomplete.js?v=${short_sha}#g; s#catalog\.js\?v=[^\"']+#catalog.js?v=${short_sha}#g; s#zenebona-program\.js\?v=[^\"']+#zenebona-program.js?v=${short_sha}#g; s#whatsapp-widget\.js\?v=[^\"']+#whatsapp-widget.js?v=${short_sha}#g" "$html"
          done
          sed -E -i "s#typography-polish\.css\?v=[^\"']+#typography-polish.css?v=${short_sha}#g; s#transit-routing\.js\?v=[^\"']+#transit-routing.js?v=${short_sha}#g; s#result-travel-polish\.js\?v=[^\"']+#result-travel-polish.js?v=${short_sha}#g; s#wizard-responsive\.css\?v=[^\"']+#wizard-responsive.css?v=${short_sha}#g; s#wizard-anchor\.js\?v=[^\"']+#wizard-anchor.js?v=${short_sha}#g; s#result-actions\.js\?v=[^\"']+#result-actions.js?v=${short_sha}#g" _site/whatsapp-widget.js
          cat > _site/release.txt <<EOF
          BMIPROGRAM_RELEASE=${release_id}
          GIT_SHA=${GITHUB_SHA}
          SCHOOL_YEAR=2026/2027
          PROGRAM_COUNT=28
          SOURCE_POLICY=canonical-current-2026-27-only
          RECOMMENDER=age-hard-multineed-multiday-multipace-identified-address-route-three-mode-ranges-map-mobile-anchor-spacious-actions-ios
          BUILT_AT=${built_at}
          EOF
          cat > _site/version.json <<EOF
          {"release":"${release_id}","gitSha":"${GITHUB_SHA}","schoolYear":"2026/2027","programCount":28,"sourcePolicy":"canonical-current-2026-27-only","recommender":"age-hard-multineed-multiday-multipace-identified-address-route-three-mode-ranges-map-mobile-anchor-spacious-actions-ios","builtAt":"${built_at}"}
          EOF
          test -f _site/index.html
          test -f _site/app.js
          test -f _site/transit-routing.js
          test -f _site/result-travel-polish.js
          test -f _site/route-map.js
          test -f _site/wizard-responsive.css
          test -f _site/wizard-anchor.js
          test -f _site/result-actions.js
          test -f _site/UX-RULES.md
          test -f _site/typography-polish.css
          test -f _site/whatsapp-widget.js
          test "$(cat _site/CNAME)" = "programvalaszto.magyariskola.at"
          grep -Fq 'PROGRAM_COUNT=28' _site/release.txt
          grep -Fq -- '-webkit-text-size-adjust:100%' _site/wizard-responsive.css
          grep -Fq 'font-size:16px!important' _site/wizard-responsive.css
          grep -Fq '.result-action-grid' _site/wizard-responsive.css
          grep -Fq 'action-wide' _site/result-actions.js
          grep -Fq 'Mobile scaling' _site/UX-RULES.md
          grep -Fq 'subtree:false' _site/wizard-anchor.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy exact artifact
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify production release, iOS scaling and responsive actions
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="${GITHUB_SHA}"
          base="${PRODUCTION_URL%/}"
          fetch() { curl --fail --silent --show-error --location --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "${base}$1?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; }
          release=''
          for attempt in $(seq 1 30); do
            if release="$(fetch /release.txt 2>/dev/null)" && grep -Fq "GIT_SHA=${expected_sha}" <<<"${release}"; then break; fi
            sleep 10
          done
          grep -Fq "GIT_SHA=${expected_sha}" <<<"${release}"
          grep -Fq 'PROGRAM_COUNT=28' <<<"${release}"
          responsive="$(fetch /wizard-responsive.css)"
          grep -Fq -- '-webkit-text-size-adjust:100%' <<<"${responsive}"
          grep -Fq 'font-size:16px!important' <<<"${responsive}"
          grep -Fq '.result-action-grid' <<<"${responsive}"
          grep -Fq 'min-height:54px!important' <<<"${responsive}"
          actions="$(fetch /result-actions.js)"
          grep -Fq 'result-action-grid' <<<"${actions}"
          grep -Fq 'action-wide' <<<"${actions}"
          wa="$(fetch /whatsapp-widget.js)"
          grep -Fq 'result-actions.js?v=' <<<"${wa}"
          grep -Fq 'wizard-responsive.css?v=' <<<"${wa}"
          rules="$(fetch /UX-RULES.md)"
          grep -Fq 'Mobile scaling' <<<"${rules}"
          grep -Fq 'Action buttons' <<<"${rules}"
          route="$(fetch /route-map.js)"
          grep -Fq 'Térkép és útvonal' <<<"${route}"
          anchor="$(fetch /wizard-anchor.js)"
          grep -Fq 'scrollToCurrentBlock' <<<"${anchor}"
          for path in / /foglalkozasok.html /korosztalyok.html /gyik.html; do
            page="$(fetch "${path}")"
            grep -Fq 'Délutáni és hétvégi foglalkozások · 2026 / 2027' <<<"${page}"
            grep -Fq 'whatsapp-widget.js?v=' <<<"${page}"
          done
          for path in /app.js /route-map.js /result-travel-polish.js /wizard-responsive.css /wizard-anchor.js /result-actions.js /UX-RULES.md /whatsapp-widget.js /release.txt /version.json; do fetch "${path}" >/dev/null; done
          echo "EXACT-LIVE: ${expected_sha} serves stable iOS scaling, equal responsive result actions, spacious mobile results, maps and wizard anchors."
