name: Patch BECS-CRAFT first date
on:
  push:
    branches:
      - fix/alapozo-schedule-2026-09-17
    paths:
      - '.github/workflows/patch-becscraft-first-date-20260917.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch canonical BECS-CRAFT source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('data.js')
          s=p.read_text(encoding='utf-8')
          lines=s.splitlines()
          hits=[i for i,line in enumerate(lines) if '{id:"becscraft"' in line]
          if len(hits)!=1:
              raise SystemExit(f'Expected exactly one becscraft record, found {len(hits)}')
          i=hits[0]
          line=lines[i]
          old='firstDate:"2026. szeptember 21."'
          new='firstDate:"2026. október 5."'
          if old not in line:
              raise SystemExit('Expected BECS-CRAFT firstDate source fragment missing')
          lines[i]=line.replace(old,new,1)
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          verify=[x for x in p.read_text(encoding='utf-8').splitlines() if '{id:"becscraft"' in x][0]
          if new not in verify or old in verify:
              raise SystemExit('BECS-CRAFT firstDate verification failed')
          PY
      - name: Commit canonical source patch and remove one-off workflow
        run: |
          git config user.name "BMI Program Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.js
          git rm .github/workflows/patch-becscraft-first-date-20260917.yml
          git commit -m "Update BECS-CRAFT first date to October 5"
          git push
