name: Strengthen external LLM discovery 20260902
on:
  push:
    paths:
      - '.github/workflows/strengthen-ai-discovery-20260902.yml'
      - 'tools/strengthen-ai-discovery.py'
      - 'ai-knowledge.html'
      - 'knowledge-index.json'
permissions:
  contents: write
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/strengthen-ai-discovery.py
      - run: grep -q 'knowledge-index.json' index.html
      - run: grep -q 'ai-knowledge.html' llms.txt
      - run: grep -q 'ai-knowledge.html' sitemap.xml
      - run: grep -q 'OAI-SearchBot' robots.txt
      - run: grep -q 'ClaudeBot' robots.txt
      - run: grep -q 'PerplexityBot' robots.txt
      - run: |
          git config user.name "BMI AI Discovery Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html llms.txt
          git diff --cached --quiet && exit 0
          git commit -m "Expose BMI knowledge graph to external LLM crawlers"
          git push
