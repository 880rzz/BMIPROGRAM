name: Unify BMI school schema id 20260902
on:
  push:
    paths:
      - '.github/workflows/unify-school-schema-id-20260902.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace legacy BMI org id with canonical school id
        run: |
          python - <<'PY'
          from pathlib import Path
          files=['index.html','foglalkozasok.html','korosztalyok.html','gyik.html','entity.jsonld','program-catalog.jsonld','.github/workflows/generate-program-machine-data-20260902.yml']
          for name in files:
              p=Path(name)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8').replace('https://www.magyariskola.at/#org','https://www.magyariskola.at/#school')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "BMI Schema Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html foglalkozasok.html korosztalyok.html gyik.html entity.jsonld program-catalog.jsonld .github/workflows/generate-program-machine-data-20260902.yml
          git diff --cached --quiet && exit 0
          git commit -m "Unify BMI school schema id with Wix canonical graph"
          git push