name: Add BMI press links to navigation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Add press links to desktop and mobile menus
        run: |
          python - <<'PY'
          from pathlib import Path

          pages=['index.html','foglalkozasok.html','korosztalyok.html','gyik.html']
          press1='https://rolunk.at/nepcsoportunk/a-megujult-becsi-magyar-iskola-elmult-egy-eve-video/'
          press2='https://rolunk.at/kultura/ujdonsagok-a-becsi-magyar-iskola-2024-25-os-taneveben/'
          desktop=(f'<a class="item press-nav" href="{press1}" target="_blank" rel="noopener">Sajtó · Megújult BMI</a>\n'
                   f'      <a class="item press-nav" href="{press2}" target="_blank" rel="noopener">Sajtó · Programok</a>')
          mobile=(f'<a class="press-mobile" href="{press1}" target="_blank" rel="noopener">Sajtó · A megújult BMI</a>\n'
                  f'      <a class="press-mobile" href="{press2}" target="_blank" rel="noopener">Sajtó · Oktatás és programok</a>')

          for name in pages:
              p=Path(name)
              text=p.read_text(encoding='utf-8')
              if press1 not in text.split('</nav>',1)[0]:
                  anchor='<a class="btn sun" href="https://2026.magyariskola.at" target="_blank" rel="noopener">Tanévbeszámoló</a>'
                  if anchor in text:
                      text=text.replace(anchor,desktop+'\n      '+anchor,1)
              drawer_start=text.find('<div class="drawer"')
              drawer_end=text.find('</div>\n</header>',drawer_start)
              drawer=text[drawer_start:drawer_end] if drawer_start>=0 and drawer_end>=0 else ''
              if press1 not in drawer:
                  anchor2='<a href="https://2026.magyariskola.at" target="_blank" rel="noopener">25/26-os tanév beszámolója</a>'
                  if anchor2 in text:
                      text=text.replace(anchor2,mobile+'\n      '+anchor2,1)
              p.write_text(text,encoding='utf-8')
          PY
      - name: Commit navigation links
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html foglalkozasok.html korosztalyok.html gyik.html
          git commit -m "Add BMI press links to navigation"
          git push origin HEAD:main
