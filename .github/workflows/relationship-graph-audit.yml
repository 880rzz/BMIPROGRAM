name: Relationship graph audit
on:
  push:
    paths:
      - 'data.js'
      - 'zenebona-program.js'
      - 'program-taxonomy.js'
      - 'programs.json'
      - 'teacher-program-audit.json'
      - 'scripts/audit-relationship-graph.mjs'
      - '.github/workflows/relationship-graph-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit programme relationship graph
        run: node scripts/audit-relationship-graph.mjs
