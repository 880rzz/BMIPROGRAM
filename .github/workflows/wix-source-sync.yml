name: Finalize verified BMI structured schedules

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Align JSON-LD schedule days
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('foglalkozasok.html').read_text(encoding='utf-8')
          def replace_in_course(title, old, new, window=9000):
              global text
              start=text.find('"name": "'+title+'"')
              if start < 0:
                  raise SystemExit('Missing course '+title)
              pos=text.find(old,start,start+window)
              if pos >= 0:
                  text=text[:pos]+new+text[pos+len(old):]
          replace_in_course('Alapozó Terápia','"byDay": [\n         "Tuesday",\n         "Thursday"\n        ]','"byDay": [\n         "Monday"\n        ]')
          replace_in_course('RAJZTÁBLA','"byDay": [\n         "Monday"\n        ]','"byDay": [\n         "Saturday"\n        ]')
          Path('foglalkozasok.html').write_text(text,encoding='utf-8')
          PY
      - name: Commit schedule alignment
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add foglalkozasok.html
          git commit -m "Align structured schedule days with Wix"
          git push origin HEAD:main

# final schedule trigger 2026-08-20T13:02+02:00
