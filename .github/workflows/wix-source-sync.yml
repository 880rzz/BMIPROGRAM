name: Sync verified BMI program data

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Normalize cserkész address across public and AI sources
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','gyik.html','foglalkozasok.html','korosztalyok.html','llms.txt','llms-full.txt']:
              path=Path(name)
              if not path.exists():
                  continue
              text=path.read_text(encoding='utf-8')
              text=text.replace('Alliiertenstraße 2.', 'Alliiertenstrasse 2.')
              text=text.replace('Alliiertenstraße 2,', 'Alliiertenstrasse 2,')
              path.write_text(text,encoding='utf-8')
          PY

      - name: Commit normalized address
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html gyik.html foglalkozasok.html korosztalyok.html llms.txt llms-full.txt
          git commit -m "Normalize cserkész address spelling"
          git push origin HEAD:main

