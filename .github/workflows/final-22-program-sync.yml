name: Final 22-program QA

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Final wording and integrity pass
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Correct the remaining public/AI wording after the canonical list was fixed.
          replacements={
            'A VIPACH Felnőtt Fotóklub, a Napraforgók kezdő és haladó néptánccsoportja, a Fókusz-csoport homloklebeny-tréning és a mindenki számára nyitott táltos dobkör kifejezetten felnőtteknek szól.':
            'A VIPACH Felnőtt Fotóklub, a Napraforgók kezdő néptánccsoportja és a Fókusz-csoport kifejezetten felnőtteknek szól. A Világfa Sárkányai program második, nyitott dobkör részéhez szülők és felnőttek is csatlakozhatnak.',
            'korosztály, téma, nap és napszak szerint':'korosztály, érdeklődés, nap és rendszeresség szerint',
            'időponttal, helyszínnel, oktatóval, díjjal':'időponttal, helyszínnel, oktatóval és hozzájárulási díjjal',
            'díjak, próbaalkalom, helyszínek, jelentkezés':'hozzájárulási díjak, próbaalkalom, helyszínek, jelentkezés',
            'Az időpontok és díjak tájékoztató jellegűek; a végleges adatokat a foglalkozásvezető adja meg.':
            'A programválasztó a hivatalos források adatait összegzi. Eltérés esetén a hivatkozott BMI-programoldal az irányadó; tagegyesületi és partnerprogramoknál a partnerszervezet saját weboldala az elsődleges forrás.',
            'Az időpontok, hozzájárulási díjak és létszámok tájékoztató jellegűek – a végleges részleteket a foglalkozásvezetőtől kapod meg. Kérdéssel bátran keress minket.':
            'A programválasztó a hivatalos források adatait összegzi. Eltérés esetén a hivatkozott BMI-programoldal az irányadó; tagegyesületi és partnerprogramoknál a partnerszervezet saját weboldala az elsődleges forrás. Kérdéssel bátran keress minket.'
          }
          for name in ['index.html','foglalkozasok.html','korosztalyok.html','gyik.html','llms.txt','llms-full.txt']:
              p=Path(name)
              if not p.exists(): continue
              t=p.read_text(encoding='utf-8')
              for old,new in replacements.items(): t=t.replace(old,new)
              p.write_text(t,encoding='utf-8')

          # Hard integrity tests.
          finder=Path('data.js').read_text(encoding='utf-8')
          program_count=finder.count('url:"')
          if program_count!=22: raise SystemExit(f'Finder must contain 22 registration URLs, got {program_count}')
          if 'napraforgok-halado' in finder or 'taltos-dobkor-mindenkinek' in finder:
              raise SystemExit('Non-independent records remain in finder data')

          app=Path('app.js').read_text(encoding='utf-8')
          if 'Regisztráció / jelentkezés' not in app:
              raise SystemExit('Final recommendation cards lack registration CTA')
          if 'cfg.programs.filter' not in app or 'score(p)' not in app:
              raise SystemExit('Finder is not using concrete program scoring')

          full=Path('foglalkozasok.html').read_text(encoding='utf-8')
          cards=len(re.findall(r'<article class="item" id="[^"]+">',full))
          if cards!=22: raise SystemExit(f'Full program page must contain 22 independent cards, got {cards}')
          if 'id="taltos-dobkor-mindenkinek"' in full or 'id="napraforgok-halado-csoport"' in full:
              raise SystemExit('Removed program cards still present')
          ctas=full.count('Részletek és jelentkezés')
          if ctas!=22: raise SystemExit(f'Every program card must have a registration/details CTA: {ctas}/22')

          llm=Path('llms-full.txt').read_text(encoding='utf-8')
          sections=len(re.findall(r'^##\s+\d+\.\s+',llm,flags=re.M))
          if sections!=22: raise SystemExit(f'LLM source must have 22 program sections, got {sections}')
          if 'Napraforgók haladó csoport' in llm or '\n## 18. Táltos dobkör mindenkinek' in llm:
              raise SystemExit('Removed standalone program remains in LLM source')
          PY
      - name: Commit final cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html foglalkozasok.html korosztalyok.html gyik.html llms.txt llms-full.txt
          git commit -m "Complete 22-program registration and source QA"
          git push origin HEAD:main

