name: Finalize canonical 22 programs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Finalize program data
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json

          # Canonical counts and terminology.
          for name in ['index.html','foglalkozasok.html','korosztalyok.html','gyik.html','llms.txt','llms-full.txt']:
              p=Path(name)
              if not p.exists(): continue
              t=p.read_text(encoding='utf-8')
              for old in ['24 foglalkozás','23 foglalkozás','24 csoport','23 csoport','24 program','23 program']:
                  t=t.replace(old,old.replace('24','22').replace('23','22'))
              t=t.replace('mind a 24','mind a 22').replace('Mind a 24','Mind a 22').replace('mind a 23','mind a 22').replace('Mind a 23','Mind a 22')
              p.write_text(t,encoding='utf-8')

          # Homepage exact stat.
          p=Path('index.html'); t=p.read_text(encoding='utf-8')
          t=re.sub(r'<div class="stat"><b>\d+</b><span>foglalkozás</span></div>','<div class="stat"><b>22</b><span>foglalkozás</span></div>',t,count=1)
          p.write_text(t,encoding='utf-8')

          # Full program page: exactly 22 independent program cards.
          p=Path('foglalkozasok.html'); t=p.read_text(encoding='utf-8')
          for pid in ['taltos-dobkor-mindenkinek','napraforgok-halado-csoport']:
              t=re.sub(r'<article class="item" id="'+re.escape(pid)+r'">.*?</article>\s*','',t,flags=re.S)

          # Canonical visible Világfa card text: one program, two phases.
          m=re.search(r'(<article class="item" id="vilagfa-sarkanyai">.*?</article>)',t,flags=re.S)
          if m:
              b=m.group(1)
              b=re.sub(r'<p class="desc" style="margin-top:12px">.*?</p>',
                '<p class="desc" style="margin-top:12px">A magyar eredetmondák világát mese, dobos dal, közös ritmus és mozgás segítségével fedezik fel. A program két egymásra épülő részből áll: először a gyermekfoglalkozás zajlik, ezt pedig nyitott közös dobkör követi, amelyhez szülők, felnőttek és nagyobb gyerekek is csatlakozhatnak.</p>',b,count=1,flags=re.S)
              b=re.sub(r'<li><span class="k">Mikor</span><span>.*?</span></li>',
                '<li><span class="k">Mikor</span><span>Havonta egy szombat délután: gyermekfoglalkozás, majd nyitott közös dobkör</span></li>',b,count=1,flags=re.S)
              b=re.sub(r'<li><span class="k">Hozzájárulási díj</span><span>.*?</span></li>',
                '<li><span class="k">Hozzájárulási díj</span><span>20 € / alkalom</span></li>',b,count=1,flags=re.S)
              t=t[:m.start(1)]+b+t[m.end(1):]

          # JSON-LD: remove non-independent items, normalize key age semantics and Világfa description.
          m=re.search(r'<script type="application/ld\+json">\s*(\{.*?\})\s*</script>',t,flags=re.S)
          if m:
              data=json.loads(m.group(1))
              age_map={'Alapozó Terápia':('5–8 év','5-8'),'RAJZTÁBLA':('10+ év','10+'),'Varázsceruza':('6–12 év','6-12'),'Kicsi Svung':('6–12 év','6-12'),'Gimi-Svung':('12–18 év','12-18')}
              for node in data.get('@graph',[]):
                  if node.get('@type')=='ItemList' and isinstance(node.get('itemListElement'),list):
                      kept=[]
                      for li in node['itemListElement']:
                          item=li.get('item',{}); name=item.get('name','')
                          if name in ['Táltos dobkör mindenkinek','Napraforgók haladó csoport']: continue
                          if name in age_map:
                              human,machine=age_map[name]
                              item.setdefault('audience',{})['audienceType']=human
                              item['typicalAgeRange']=machine
                          if name=='Világfa Sárkányai':
                              item['description']='A program két egymásra épülő részből áll: magyar eredetmondákra, dobos dalokra, ritmusra és mozgásra épülő gyermekfoglalkozás, majd nyitott közös dobkör, amelyhez szülők, felnőttek és nagyobb gyerekek is csatlakozhatnak.'
                              item.setdefault('audience',{})['audienceType']='Gyermekrész: 6–14 év; nyitott dobkör: nagyobb gyerekek és felnőttek'
                              item['typicalAgeRange']='6-99'
                          kept.append(li)
                      for i,li in enumerate(kept,1): li['position']=i
                      node['itemListElement']=kept
              t=t[:m.start(1)]+json.dumps(data,ensure_ascii=False,indent=1)+t[m.end(1):]
          t=t.replace('<p class="count" id="count">24 foglalkozás</p>','<p class="count" id="count">22 foglalkozás</p>').replace('<p class="count" id="count">23 foglalkozás</p>','<p class="count" id="count">22 foglalkozás</p>')
          p.write_text(t,encoding='utf-8')

          # Age page: remove the two non-independent cards everywhere, fix known stale badges, remove Gimi from adult.
          p=Path('korosztalyok.html'); t=p.read_text(encoding='utf-8')
          def remove_card(section,pid):
              return re.sub(r'<article class="item">(?:(?!</article>).)*?href="foglalkozasok\.html#'+re.escape(pid)+r'"(?:(?!</article>).)*?</article>\s*','',section,flags=re.S)
          for pid in ['taltos-dobkor-mindenkinek','napraforgok-halado-csoport']:
              t=remove_card(t,pid)
          # Fix stale day badges in every matching card.
          def fix_card(text,pid,fn):
              pat=r'(<article class="item">(?:(?!</article>).)*?href="foglalkozasok\.html#'+re.escape(pid)+r'"(?:(?!</article>).)*?</article>)'
              return re.sub(pat,lambda m:fn(m.group(1)),text,flags=re.S)
          t=fix_card(t,'alapozo-terapia',lambda b:b.replace('<span class="chip">Kedd</span><span class="chip">Csütörtök</span>','<span class="chip">Hétfő</span>'))
          t=fix_card(t,'rajztabla',lambda b:b.replace('<span class="chip">Hétfő</span>','<span class="chip">Szombat</span>'))
          # Adult section must not contain Gimi-Svung.
          sec=re.search(r'(<section class="section(?: tint)?" id="felnott">.*?</section>)',t,flags=re.S)
          if sec:
              s=remove_card(sec.group(1),'gimi-svung')
              t=t[:sec.start(1)]+s+t[sec.end(1):]
          # Canonical Világfa summaries.
          t=fix_card(t,'vilagfa-sarkanyai',lambda b:re.sub(r'<p class="desc" style="margin-top:10px">.*?</p>','<p class="desc" style="margin-top:10px">Két egymásra épülő rész: magyar eredetmondákra és közös ritmusra épülő gyermekfoglalkozás, majd nyitott dobkör szülőknek, felnőtteknek és nagyobb gyerekeknek.</p>',b,count=1,flags=re.S))
          # Recount each age section.
          def recount(m):
              s=m.group(0); n=len(re.findall(r'<article class="item">',s)); return re.sub(r'<h2>\d+ foglalkozás</h2>',f'<h2>{n} foglalkozás</h2>',s,count=1)
          t=re.sub(r'<section class="section(?: tint)?" id="[^"]+">.*?</section>',recount,t,flags=re.S)
          p.write_text(t,encoding='utf-8')

          # LLM full: exactly 22 sections and one canonical Világfa entry.
          p=Path('llms-full.txt'); t=p.read_text(encoding='utf-8')
          for title in ['Táltos dobkör mindenkinek','Napraforgók haladó csoport']:
              t=re.sub(r'^##\s+\d+\.\s+'+re.escape(title)+r'\n.*?(?=^##\s+\d+\.|^#\s+Gyakori|\Z)','',t,flags=re.S|re.M)
          vm=re.search(r'(^##\s+\d+\.\s+Világfa Sárkányai\n.*?)(?=^##\s+\d+\.|^#\s+Gyakori|\Z)',t,flags=re.S|re.M)
          if vm:
              s=vm.group(1)
              s=re.sub(r'^- Leírás:.*$','- Leírás: A program két egymásra épülő részből áll: először magyar eredetmondákra, dobos dalokra, közös ritmusra és mozgásra épülő gyermekfoglalkozás zajlik, ezt nyitott közös dobkör követi, amelyhez szülők, felnőttek és nagyobb gyerekek is csatlakozhatnak.',s,flags=re.M)
              s=re.sub(r'^- Időpont:.*$','- Időpont: Havonta egy szombat délután: gyermekfoglalkozás, majd nyitott közös dobkör',s,flags=re.M)
              s=re.sub(r'^- Hozzájárulási díj:.*$','- Hozzájárulási díj: 20 € / alkalom',s,flags=re.M)
              t=t[:vm.start(1)]+s+t[vm.end(1):]
          lines=t.splitlines(); out=[]; n=0
          for line in lines:
              if re.match(r'^##\s+\d+\.\s+',line):
                  n+=1; line=re.sub(r'^##\s+\d+\.',f'## {n}.',line)
              out.append(line)
          if n!=22: raise SystemExit(f'Expected 22 LLM program sections, got {n}')
          p.write_text('\n'.join(out)+'\n',encoding='utf-8')

          # Hard QA on the finder data.
          datajs=Path('data.js').read_text(encoding='utf-8')
          if datajs.count('id:"') < 22: raise SystemExit('Finder data unexpectedly short')
          if 'napraforgok-halado' in datajs or 'taltos-dobkor-mindenkinek' in datajs: raise SystemExit('Removed records still present in finder data')
          if datajs.count('url:"') != 22: raise SystemExit('Every one of the 22 finder programs must have a registration URL')
          PY
      - name: Commit final canonical state
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html foglalkozasok.html korosztalyok.html gyik.html llms.txt llms-full.txt
          git commit -m "Finalize canonical 22-program selector"
          git push origin HEAD:main

# finalizer trigger 2026-08-20T14:14+02:00
