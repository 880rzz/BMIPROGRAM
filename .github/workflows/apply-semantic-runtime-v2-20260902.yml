name: Apply semantic recommender runtime v2
on:
  push:
    paths:
      - '.github/workflows/apply-semantic-runtime-v2-20260902.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/wire-semantic-runtime.py
      - run: node --check semantic-runtime.js
      - run: node --check app.js
      - run: node scripts/validate.mjs
      - run: node scripts/validate-schema-age.mjs
      - run: node scripts/validate-matching.mjs
      - run: grep -q 'semantic-runtime.js?v=20260902-1' index.html
      - run: grep -q 'score+=semanticFit(p).bonus' app.js
      - run: |
          git config user.name "BMI Semantic Recommender Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html app.js
          git diff --cached --quiet && exit 0
          git commit -m "Use root-cause and solution model in live recommender"
          git push
