name: Sync authority schema to all HTML pages

on:
  push:
    branches: [main]
    paths:
      - 'entity.jsonld'
      - 'rolunk-authority.json'
      - '.github/workflows/sync-authority-schema.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject canonical authority graph into every HTML page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('entity.jsonld').read_text(encoding='utf-8').strip()
          start = '<!-- ecosystem-authority-schema:start -->'
          end = '<!-- ecosystem-authority-schema:end -->'
          block = f'{start}\n<script type="application/ld+json">\n{source}\n</script>\n{end}'
          changed=[]
          for p in Path('.').rglob('*.html'):
              if any(part in {'.git','node_modules','vendor'} for part in p.parts): continue
              s=p.read_text(encoding='utf-8')
              if start in s and end in s:
                  a=s.index(start); b=s.index(end,a)+len(end); n=s[:a]+block+s[b:]
              elif '</head>' in s:
                  n=s.replace('</head>',block+'\n</head>',1)
              else: continue

              # Google Search no longer uses Dataset rich results. Keep the
              # knowledge hub as a WebPage, avoiding Dataset enhancement
              # warnings for creator, license and isPartOf in Search Console.
              n=n.replace('"@type": ["WebPage", "Dataset"]','"@type": "WebPage"')
              n=n.replace('"@type":["WebPage","Dataset"]','"@type":"WebPage"')

              # distribution is a Dataset-specific property. The actual
              # download links remain visible in the page body and machine
              # knowledge files, so remove only the obsolete HTML JSON-LD
              # enhancement block from the dedicated AI knowledge page.
              if p.name == 'ai-knowledge.html':
                  n=re.sub(r',\n  "distribution":\[.*?\n  \]\n}', '\n}', n, count=1, flags=re.S)

              if n!=s: p.write_text(n,encoding='utf-8'); changed.append(str(p))
          print('updated',len(changed),'HTML files'); [print(f) for f in changed]
          PY
      - name: Commit synchronized HTML
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "ecosystem-schema-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Sync authority schema and normalize Google markup"
          git push