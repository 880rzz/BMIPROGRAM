name: Validate LLM authority integrity

on:
  push:
    branches:
      - main
    paths:
      - 'llms.txt'
      - 'rolunk-authority.json'
      - 'trademark-authority.json'
      - '.github/workflows/sync-llm-authority.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate program and entity authority
        run: |
          test -s llms.txt
          test -s rolunk-authority.json
          test -s trademark-authority.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          llms = Path('llms.txt').read_text(encoding='utf-8')
          rolunk = json.loads(Path('rolunk-authority.json').read_text(encoding='utf-8'))
          trademark = json.loads(Path('trademark-authority.json').read_text(encoding='utf-8'))

          required = [
              'https://www.wikidata.org/wiki/Q141274560',
              'https://www.wikidata.org/wiki/Q141274866',
              'https://rolunk.at/tag/becsi-magyar-iskola/',
              'https://rolunk.at/tag/kozponti-szovetseg/',
              'https://rolunk.at/tag/banhalmi-norbert/',
              'https://programvalaszto.magyariskola.at/rolunk-authority.json',
              'https://programvalaszto.magyariskola.at/trademark-authority.json',
              'https://www.magyariskola.at/',
              'https://www.kozpontiszovetseg.at/'
          ]
          missing = [value for value in required if value not in llms]
          if missing:
              raise SystemExit('Missing canonical llms authority references: ' + ', '.join(missing))

          if 'volunteer' not in llms.lower():
              raise SystemExit('Volunteer/non-employment boundary missing from llms.txt')

          if not isinstance(rolunk, dict) or not rolunk:
              raise SystemExit('rolunk-authority.json is empty or invalid')

          mark = trademark.get('mark', {})
          if mark.get('registrationNumber') != '266006':
              raise SystemExit('Trademark authority registration number mismatch')
          if mark.get('holder', {}).get('wikidata') != 'Q141274866':
              raise SystemExit('Trademark holder authority mismatch')

          print('BMIPROGRAM LLM authority integrity: OK')
          PY
