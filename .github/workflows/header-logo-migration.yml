name: Install BMI header logo

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Materialize approved transparent BMI logo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/git/blobs/8e5d7088438fad31937221c2b0121bfce8dd3c78 --jq .content | tr -d '\n' | base64 -d > bmi-header-logo.png

      - name: Replace header logo on every HTML page
        run: |
          python - <<'PY'
          from pathlib import Path

          pages = [Path('index.html'), Path('foglalkozasok.html'), Path('korosztalyok.html'), Path('gyik.html')]
          old = '<img src="bmi_blue_round_rgb_logo.svg" alt="Bécsi Magyar Iskola logó" width="38" height="38">'
          new = '<img class="brand-logo" src="bmi-header-logo.png" alt="Bécsi Magyar Iskola – BMI" width="120" height="43">'
          for page in pages:
              text = page.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected header logo markup missing in {page}')
              page.write_text(text.replace(old, new), encoding='utf-8')

          css = Path('styles.css')
          text = css.read_text(encoding='utf-8')
          marker = '.brand-logo{display:block;width:120px;height:auto;flex:0 0 auto;object-fit:contain}'
          if marker not in text:
              text += '\n' + marker + '\n@media(max-width:640px){.brand-logo{width:104px}}\n'
              css.write_text(text, encoding='utf-8')
          PY

      - name: Commit logo migration
        run: |
          if git diff --quiet && git ls-files --error-unmatch bmi-header-logo.png >/dev/null 2>&1; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bmi-header-logo.png styles.css index.html foglalkozasok.html korosztalyok.html gyik.html
          git commit -m "Replace site header with approved BMI logo"
          git push origin HEAD:main
