name: Fix Örömzene Hupczik relationship 20260902

on:
  push:
    paths:
      - 'tools/fix-oromzene-hupczik-andrea.py'
      - '.github/workflows/fix-oromzene-hupczik-20260902.yml'

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply canonical relationship fix
        run: python3 tools/fix-oromzene-hupczik-andrea.py
      - name: Rebuild machine knowledge
        run: node scripts/build-program-knowledge.mjs
      - name: Validate program ecosystem
        run: |
          node scripts/validate.mjs
          node scripts/validate-matching.mjs
          node scripts/validate-schema-age.mjs
      - name: Commit generated corrections
        run: |
          git config user.name "ecosystem-steward[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zenebona-program.js program-knowledge.json program-knowledge.jsonld program-catalog.jsonld programs.json teacher-program-audit.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Set Örömzene to Hupczik Andrea and align Táltos schedule"
          git push
