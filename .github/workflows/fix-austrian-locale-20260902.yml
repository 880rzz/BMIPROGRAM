name: Fix Program Selector Austrian locale 20260902
on:
  push:
    paths:
      - '.github/workflows/fix-austrian-locale-20260902.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize public locale metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changed=[]
          for p in Path('.').glob('*.html'):
            s=p.read_text(encoding='utf-8'); old=s
            s=s.replace('hu_HU','hu_AT').replace('hu-HU','hu-AT')
            if s!=old:p.write_text(s,encoding='utf-8');changed.append(str(p))
          print('changed',changed)
          for p in Path('.').glob('*.html'):
            s=p.read_text(encoding='utf-8')
            if 'hu_HU' in s or 'hu-HU' in s:raise SystemExit(f'wrong Hungarian locale remains in {p}')
          PY
      - name: Commit
        run: |
          git config user.name "BMI Integrity Bot"
          git config user.email "actions@users.noreply.github.com"
          git add '*.html'
          git diff --cached --quiet && exit 0
          git commit -m "Normalize Program Selector metadata to hu-AT"
          git push
