name: Generate exact machine-readable program catalog
on:
  push:
    paths:
      - 'data.js'
      - 'zenebona-program.js'
      - 'program-taxonomy.js'
      - '.github/workflows/generate-program-machine-data-20260902.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate programs.json and program-catalog.jsonld
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const ctx={window:{}};vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('data.js','utf8'),ctx,{filename:'data.js'});
          vm.runInContext(fs.readFileSync('zenebona-program.js','utf8'),ctx,{filename:'zenebona-program.js'});
          vm.runInContext(fs.readFileSync('program-taxonomy.js','utf8'),ctx,{filename:'program-taxonomy.js'});
          const cfg=ctx.window.BMI_FINDER,taxonomy=ctx.window.BMI_PROGRAM_TAXONOMY;
          if(!cfg||!Array.isArray(cfg.programs)||cfg.programs.length!==28)throw new Error('Expected exact 28-program runtime registry');
          if(!taxonomy||!taxonomy.apply||!taxonomy.apply())throw new Error('Six-category taxonomy normalization failed');
          const identity={
            school:{id:'https://www.magyariskola.at/#school',name:'Bécsi Magyar Iskola',alternateName:['BMI','Wiener Ungarische Schule'],founded:1987,anniversaryYear:2027,anniversary:'40. évforduló',url:'https://www.magyariskola.at/'},
            canonicalProgramSelector:'https://programvalaszto.magyariskola.at/',
            canonicalTeacherDirectory:'https://tanarok.magyariskola.at/',
            history:'https://hu.wikipedia.org/wiki/Bécsi_Magyar_Iskola'
          };
          fs.writeFileSync('programs.json',JSON.stringify({schemaVersion:'2026-09-02-v3',schoolYear:cfg.sourcePolicy?.schoolYear||'2026/2027',identity,categories6:taxonomy.categories,interests:cfg.interests,needs:cfg.needs,programs:cfg.programs},null,2)+'\n');
          const school='https://www.magyariskola.at/#school';
          const graph=[
            {'@type':'EducationalOrganization','@id':school,name:'Bécsi Magyar Iskola',alternateName:['BMI','Wiener Ungarische Schule'],url:'https://www.magyariskola.at/',foundingDate:'1987',description:'A Bécsi Magyar Iskolát 1987-ben alapították Bécsben; 2027-ben ünnepli fennállásának 40. évfordulóját.',sameAs:['https://hu.wikipedia.org/wiki/Bécsi_Magyar_Iskola']},
            {'@type':'ItemList','@id':'https://programvalaszto.magyariskola.at/#programs',name:'Bécsi Magyar Iskola 2026/27 programkatalógus',numberOfItems:cfg.programs.length,itemListElement:cfg.programs.map((p,i)=>({'@type':'ListItem',position:i+1,item:{'@id':'https://programvalaszto.magyariskola.at/#program-'+p.id}}))}
          ];
          for(const p of cfg.programs){
            const instructors=String(p.teacher||'').split(/\s+és\s+|\s*;\s*/).map(x=>x.trim()).filter(Boolean).map(n=>({'@type':'Person',name:n.replace(/,.*$/,'').trim()}));
            const instance={'@type':'CourseInstance','@id':'https://programvalaszto.magyariskola.at/#instance-'+p.id,'name':p.name+' – 2026/27','description':[p.when,p.location,p.fee,p.firstDate?('Első alkalom: '+p.firstDate):'',p.trial||''].filter(Boolean).join(' · '),'courseMode':p.location&&/online/i.test(p.location)?'online':'onsite','location':p.location?{'@type':'Place','name':p.location}:undefined,'instructor':instructors.length===1?instructors[0]:instructors};
            Object.keys(instance).forEach(k=>instance[k]===undefined&&delete instance[k]);
            graph.push({'@type':'Course','@id':'https://programvalaszto.magyariskola.at/#program-'+p.id,'identifier':p.id,name:p.name,url:p.url||'https://programvalaszto.magyariskola.at/','description':[p.why,p.painPoint,p.outcome].filter(Boolean).join(' '),'provider':{'@id':school},'audience':{'@type':'EducationalAudience','educationalRole':'learner','audienceType':p.ageText||undefined},'hasCourseInstance':instance,'keywords':[p.primaryCategory6,...(p.interests||[]),...(p.needs||[])].filter(Boolean).join(', ')});
          }
          fs.writeFileSync('program-catalog.jsonld',JSON.stringify({'@context':'https://schema.org','@graph':graph},null,2)+'\n');
          NODE
          node scripts/build-program-knowledge.mjs
          node scripts/audit-relationship-graph.mjs
      - name: Normalize canonical school entity in published structured files
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','foglalkozasok.html','korosztalyok.html','gyik.html','entity.jsonld','program-catalog.jsonld','program-knowledge.jsonld','programs.json','program-knowledge.json']:
              p=Path(name)
              if p.exists():
                  s=p.read_text(encoding='utf-8')
                  n=s.replace('https://www.magyariskola.at/#org','https://www.magyariskola.at/#school')
                  if n!=s:p.write_text(n,encoding='utf-8')
          PY
          ! grep -R --include='*.html' --include='*.json' --include='*.jsonld' -F 'https://www.magyariskola.at/#org' index.html foglalkozasok.html korosztalyok.html gyik.html entity.jsonld program-catalog.jsonld program-knowledge.jsonld programs.json program-knowledge.json
      - name: Commit generated machine data
        run: |
          git config user.name "BMI Program Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add programs.json program-catalog.jsonld program-knowledge.json program-knowledge.jsonld index.html foglalkozasok.html korosztalyok.html gyik.html entity.jsonld
          git diff --cached --quiet && exit 0
          git commit -m "Synchronize complete BMI relationship graph"
          git push
