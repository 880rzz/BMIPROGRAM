name: Unify area icons and teacher links 20260902

on:
  push:
    paths:
      - '.github/workflows/unify-area-icons-and-teachers-20260902.yml'

permissions:
  contents: write

jobs:
  unify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unify program area icon system and teacher assignments
        shell: python
        run: |
          from pathlib import Path
          import re

          # Ensure the two known role assignments are present in canonical program data.
          p=Path('data.js'); s=p.read_text(encoding='utf-8')
          def set_teacher(pid, teacher, background):
              global s
              pat=r'(\{id:"'+re.escape(pid)+r'".*?)(,fee:)'
              m=re.search(pat,s,re.S)
              if not m: raise SystemExit('program not found: '+pid)
              prefix=re.sub(r',teacher:"[^"]*"','',m.group(1))
              prefix=re.sub(r',teacherBackground:"[^"]*"','',prefix)
              prefix+=',teacher:"'+teacher+'",teacherBackground:"'+background+'"'
              s=s[:m.start()]+prefix+m.group(2)+s[m.end():]
          set_teacher('gimi-svung','Pohl Balázs','Drámapedagógus; író-rendező; a SVUNG – Bécsi Magyar Színház művészeti vezetője.')
          set_teacher('cserkeszet','Póser-Piroska Ildikó, csapatparancsnok','A 72. sz. Széchenyi István Cserkészcsapat – Bécs csapatparancsnoka; ifjúsági közösségi vezető.')
          p.write_text(s,encoding='utf-8')

          # Use the same vector icon assets on every public program browsing surface.
          for fn in ['index.html','foglalkozasok.html','korosztalyok.html']:
              q=Path(fn)
              if not q.exists(): continue
              h=q.read_text(encoding='utf-8')
              if 'area-icons.css' not in h:
                  h=h.replace('</head>','<link rel="stylesheet" href="area-icons.css?v=20260902-1">\n<script defer src="area-icons.js?v=20260902-1"></script>\n</head>',1)
              q.write_text(h,encoding='utf-8')

          # Keep the teacher linker explicit and role-correct.
          t=Path('teacher-links.js'); z=t.read_text(encoding='utf-8')
          if '"Pohl Balázs":"pohl-balazs"' not in z:
              z=z.replace('var map={','var map={"Pohl Balázs":"pohl-balazs",',1)
          if '"Póser-Piroska Ildikó":"poser-piroska-ildiko"' not in z:
              z=z.replace('var map={','var map={"Póser-Piroska Ildikó":"poser-piroska-ildiko",',1)
          t.write_text(z,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "BMI Program Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.js teacher-links.js index.html foglalkozasok.html korosztalyok.html area-icons.js area-icons.css
          git diff --cached --quiet && exit 0
          git commit -m "Unify teacher links and vector area icons across Programvalaszto"
          git push
