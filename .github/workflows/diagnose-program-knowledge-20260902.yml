name: Diagnose program knowledge 20260902

on:
  push:
    paths:
      - '.github/workflows/diagnose-program-knowledge-20260902.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture exact semantic build error
        run: |
          set +e
          node scripts/build-program-knowledge.mjs > program-knowledge-diagnostic.txt 2>&1
          code=$?
          echo "exit_code=$code" >> program-knowledge-diagnostic.txt
          exit 0
      - name: Commit diagnostic
        run: |
          git config user.name "BMI Audit Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add program-knowledge-diagnostic.txt
          git diff --cached --quiet && exit 0
          git commit -m "Capture program semantic build diagnostic"
          git push
