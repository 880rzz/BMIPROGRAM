name: Repair teacher-program integrity 20260902

on:
  push:
    paths:
      - '.github/workflows/repair-teacher-program-integrity-20260902.yml'
      - 'tools/repair_teacher_program_links.py'
      - 'scripts/audit-teacher-program-links.mjs'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair exact teacher-program relationships
        run: python3 tools/repair_teacher_program_links.py
      - name: Regenerate machine-readable program catalog
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const ctx={window:{}};vm.createContext(ctx);vm.runInContext(fs.readFileSync('data.js','utf8'),ctx);
          const cfg=ctx.window.BMI_FINDER;
          if(!cfg||!Array.isArray(cfg.programs))throw new Error('BMI_FINDER programs missing');
          const identity={school:{name:'Bécsi Magyar Iskola',alternateName:['BMI','Wiener Ungarische Schule'],founded:1987,anniversaryYear:2027,anniversary:'40. évforduló',url:'https://www.magyariskola.at/'},canonicalProgramSelector:'https://programvalaszto.magyariskola.at/',canonicalTeacherDirectory:'https://tanarok.magyariskola.at/',history:'https://hu.wikipedia.org/wiki/Bécsi_Magyar_Iskola'};
          fs.writeFileSync('programs.json',JSON.stringify({schemaVersion:'2026-09-02',schoolYear:cfg.sourcePolicy?.schoolYear||'2026/2027',identity,interests:cfg.interests,needs:cfg.needs,programs:cfg.programs},null,2)+'\n');
          const school='https://www.magyariskola.at/#org';
          const graph=[{'@type':['EducationalOrganization','School'],'@id':school,name:'Bécsi Magyar Iskola',alternateName:['BMI','Wiener Ungarische Schule'],url:'https://www.magyariskola.at/',foundingDate:'1987'},{'@type':'ItemList','@id':'https://programvalaszto.magyariskola.at/#programs',name:'Bécsi Magyar Iskola 2026/27 programkatalógus',numberOfItems:cfg.programs.length,itemListElement:cfg.programs.map((p,i)=>({'@type':'ListItem',position:i+1,item:{'@id':'https://programvalaszto.magyariskola.at/#program-'+p.id}}))}];
          for(const p of cfg.programs){
            const instructors=String(p.teacher||'').split(/\s+és\s+|\s*;\s*/).map(x=>x.trim()).filter(Boolean).map(n=>({'@type':'Person',name:n.replace(/,.*$/,'').trim()}));
            const instance={'@type':'CourseInstance','@id':'https://programvalaszto.magyariskola.at/#instance-'+p.id,'name':p.name+' – 2026/27','description':[p.when,p.location,p.fee].filter(Boolean).join(' · '),'courseMode':p.location&&/online/i.test(p.location)?'online':'onsite','location':p.location?{'@type':'Place','name':p.location}:undefined,'instructor':instructors.length===1?instructors[0]:instructors};
            Object.keys(instance).forEach(k=>instance[k]===undefined&&delete instance[k]);
            graph.push({'@type':'Course','@id':'https://programvalaszto.magyariskola.at/#program-'+p.id,'identifier':p.id,name:p.name,url:p.url||'https://programvalaszto.magyariskola.at/','description':[p.why,p.painPoint,p.outcome].filter(Boolean).join(' '),'provider':{'@id':school},'audience':{'@type':'EducationalAudience','audienceType':p.ageText||undefined},'hasCourseInstance':instance,'keywords':(p.interests||[]).join(', ')});
          }
          fs.writeFileSync('program-catalog.jsonld',JSON.stringify({'@context':'https://schema.org','@graph':graph},null,2)+'\n');
          NODE
      - name: Rebuild semantic program knowledge
        run: node scripts/build-program-knowledge.mjs
      - name: Validate all program matching and teacher relationships
        run: |
          node scripts/audit-teacher-program-links.mjs
          node scripts/validate.mjs
          node scripts/validate-matching.mjs
          node audit/finder-integrity-audit.js
      - name: Commit repaired ecosystem
        run: |
          git config user.name "BMI Ecosystem Integrity Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.js programs.json program-catalog.jsonld program-knowledge.json program-knowledge.jsonld teacher-program-audit.json
          git diff --cached --quiet && exit 0
          git commit -m "Fix teacher-program mappings and add integrity contract"
          git push
