name: Diagnose semantic contract 2 20260902

on:
  push:
    paths:
      - '.github/workflows/diagnose-semantic-contract-2-20260902.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply known Napraforgocskak fix in workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('zenebona-program.js');s=p.read_text(encoding='utf-8')
          old="napra.weekday='szerda';napra.weekdays=['szerda'];napra.pace='rendszeres';napra.when='Minden szerdán 17:00–18:00';"
          new=old+"\n  napra.teacher='Varga Bernadette és Veres Tamás';\n  if(!napra.location)napra.location='Bécsi Magyar Iskola, Schwedenplatz 2 / Laurenzerberg 5., 1010 Wien, Top 8';"
          if "napra.teacher='Varga Bernadette és Veres Tamás'" not in s:
              if old not in s: raise SystemExit('napra marker missing')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Capture next build error
        run: |
          set +e
          node scripts/build-program-knowledge.mjs > semantic-contract-diagnostic-2.txt 2>&1
          code=$?
          echo "exit_code=$code" >> semantic-contract-diagnostic-2.txt
          exit 0
      - name: Commit diagnostic only
        run: |
          git config user.name "BMI Audit Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add semantic-contract-diagnostic-2.txt
          git commit -m "Capture next program semantic contract diagnostic"
          git push
