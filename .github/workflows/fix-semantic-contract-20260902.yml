name: Fix semantic contract 20260902

on:
  push:
    paths:
      - '.github/workflows/fix-semantic-contract-20260902.yml'

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair Napraforgocskak canonical runtime fields
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('zenebona-program.js')
          s=p.read_text(encoding='utf-8')
          old="""if(napra){
            napra.weekday='szerda';napra.weekdays=['szerda'];napra.pace='rendszeres';napra.when='Minden szerdán 17:00–18:00';
            napra.eventDates=recurringDates(napra);
          }"""
          new="""if(napra){
            napra.weekday='szerda';napra.weekdays=['szerda'];napra.pace='rendszeres';napra.when='Minden szerdán 17:00–18:00';
            napra.teacher='Varga Bernadette és Veres Tamás';
            if(!napra.location)napra.location='Bécsi Magyar Iskola, Schwedenplatz 2 / Laurenzerberg 5., 1010 Wien, Top 8';
            napra.eventDates=recurringDates(napra);
          }"""
          if old not in s:
              raise SystemExit('Napraforgocskak correction block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Build full 28-program semantic knowledge
        run: node scripts/build-program-knowledge.mjs
      - name: Validate selector matching
        run: node scripts/validate-matching.mjs
      - name: Commit repaired registry and knowledge graph
        run: |
          git config user.name "BMI Ecosystem Audit Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zenebona-program.js program-knowledge.json program-knowledge.jsonld
          git commit -m "Repair Napraforgocskak semantic contract and build 28-program graph"
          git push
