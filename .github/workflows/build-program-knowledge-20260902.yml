name: Build program knowledge 20260902

on:
  push:
    paths:
      - 'scripts/build-program-knowledge.mjs'
      - 'semantic-model.json'
      - '.github/workflows/build-program-knowledge-20260902.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build program knowledge
        run: node scripts/build-program-knowledge.mjs
      - name: Commit generated program knowledge
        run: |
          git config user.name "BMI Program Knowledge Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add program-knowledge.json program-knowledge.jsonld
          git diff --cached --quiet && exit 0
          git commit -m "Build canonical program problem-solution knowledge graph"
          git push
