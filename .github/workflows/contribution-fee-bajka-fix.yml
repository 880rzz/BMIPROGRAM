name: Normalize contribution fees and Bajka schedules

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Apply content corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Global terminology normalization in public HTML and AI-readable sources.
          for name in ['index.html','foglalkozasok.html','korosztalyok.html','gyik.html','llms.txt','llms-full.txt','app.js']:
              p=Path(name)
              if not p.exists():
                  continue
              text=p.read_text(encoding='utf-8')
              text=text.replace('<span class="k">Díj</span>', '<span class="k">Hozzájárulási díj</span>')
              text=text.replace('Díj:', 'Hozzájárulási díj:')
              text=text.replace('A díjak foglalkozásonként eltérnek:', 'A hozzájárulási díjak foglalkozásonként eltérnek:')
              text=text.replace('Mennyibe kerülnek a foglalkozások?', 'Mekkora a foglalkozások hozzájárulási díja?')
              text=text.replace('a díjakról, próbaalkalomról és helyszínekről', 'a hozzájárulási díjakról, próbaalkalomról és helyszínekről')
              text=text.replace('Az időpontok, díjak és létszámok tájékoztató jellegűek', 'Az időpontok, hozzájárulási díjak és létszámok tájékoztató jellegűek')
              p.write_text(text,encoding='utf-8')

          # Bajka Kinga Csengele activities must end by 18:00, never 18:30.
          def fix_bajka_html(text):
              # Work article-by-article so unrelated 18:30 programs remain untouched.
              parts=re.split(r'(?=<article\b)', text)
              out=[]
              for part in parts:
                  if 'Bajka Kinga Csengele' in part:
                      part=part.replace('18:30','18:00')
                  out.append(part)
              return ''.join(out)

          for name in ['foglalkozasok.html','korosztalyok.html']:
              p=Path(name)
              text=fix_bajka_html(p.read_text(encoding='utf-8'))
              p.write_text(text,encoding='utf-8')

          # Markdown/LLM program sections: only sections that name Bajka.
          p=Path('llms-full.txt')
          text=p.read_text(encoding='utf-8')
          sections=re.split(r'(?=^##\s+\d+\.)', text, flags=re.M)
          fixed=[]
          for sec in sections:
              if 'Bajka Kinga Csengele' in sec:
                  sec=sec.replace('18:30','18:00')
              fixed.append(sec)
          p.write_text(''.join(fixed),encoding='utf-8')
          PY
      - name: Commit corrections
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html foglalkozasok.html korosztalyok.html gyik.html llms.txt llms-full.txt app.js
          git commit -m "Use contribution fee wording and correct Bajka end times"
          git push origin HEAD:main
